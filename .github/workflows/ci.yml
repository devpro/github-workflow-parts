name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: ./.github/workflows/reusable-markup-lint.yml

  test-terraform-setup:
    name: "Test / Terraform setup action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install terraform
        uses: ./actions/terraform/setup
      - name: Verify terraform is installed
        run: |
          terraform version
          command -v terraform

  test-tflint-setup:
    name: "Test / TFLint setup action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup TFLint
        uses: ./actions/tflint/setup
      - name: Verify tflint is installed
        run: |
          tflint --version
          command -v tflint

  test-helm-setup:
    name: "Test / Helm setup action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Helm
        uses: ./actions/helm/setup
      - name: Verify helm is installed
        run: |
          helm version
          command -v helm

  test-chart-testing-setup:
    name: "Test / chart-testing setup action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Setup Helm
        uses: ./actions/helm/setup
      - name: Setup chart-testing
        uses: ./actions/chart-testing/setup
      - name: Verify chart-testing is installed
        run: |
          ct version
          command -v ct yamllint yamale

  test-mongodb-start:
    name: "Test / MongoDB start action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Start MongoDB
        uses: ./actions/mongodb/start
      - name: Verify MongoDB answers
        run: |
          mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' mongodb://127.0.0.1:27017 | grep -qx 1

  test-syft-generate-sbom:
    name: "Test / Syft generate-sbom action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Generate SBOM for this repository
        uses: ./actions/syft/generate-sbom
        with:
          target-path: actions
          output-file: sbom-test.spdx.json
          upload-artifact: "false"
      - name: Verify SBOM was generated
        run: |
          test -s sbom-test.spdx.json
          grep -q '"spdxVersion"' sbom-test.spdx.json

  test-trivy-scan:
    name: "Test / Trivy scan action"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Scan a real image with Trivy
        uses: ./actions/trivy/scan
        with:
          scan-type: image
          target: devprofr/terraform-backend-mongodb:latest
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Scan a directory with Trivy
        uses: ./actions/trivy/scan
        with:
          scan-type: config
          target: test/fixtures/terraform
          format: sarif
          output-file: trivy-test.sarif
          severity: HIGH,CRITICAL
      - name: Verify SARIF report was generated
        run: test -s trivy-test.sarif

  test-terraform-quality:
    name: "Test / Terraform quality reusable workflow"
    uses: ./.github/workflows/reusable-terraform-quality.yml
    with:
      working-directory: test/fixtures/terraform

  test-dotnet-quality:
    name: "Test / .NET quality reusable workflow"
    uses: ./.github/workflows/reusable-dotnet-quality.yml
    with:
      working-directory: test/fixtures/dotnet
      # The fixture holds a test that fails, which only the filter keeps the job from running.
      dotnet-test-filter: --filter-not-namespace Fixture.Tests.LeftOut*

  test-container-scan-on-base:
    name: "Test / Container scan reusable workflow on a base built in the run"
    uses: ./.github/workflows/reusable-container-scan.yml
    with:
      base-image-definition: test/fixtures/container/base/Dockerfile
      image-definition: test/fixtures/container/derived/Dockerfile
      image-name: scan-test
      image-path: local
      image-tag: ${{ github.run_id }}
