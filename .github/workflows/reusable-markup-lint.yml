name: Reusable - Markup Lint

on:
  workflow_call:
    inputs:
      job-name:
        description: "Job name"
        type: string
        required: false
        default: "Lint"
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 10
      operating-system:
        description: "Operating system executing the runner"
        type: string
        required: false
        default: "ubuntu-latest"
      working-directory:
        description: "Working directory"
        type: string
        required: false
        default: "."

jobs:
  markup-lint:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The linters are pinned, so that a new release changes the verdict on a repository only when this one moves to it.
      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"
      - name: Lint YAML files
        run: pipx run --spec yamllint==1.38.0 yamllint .
