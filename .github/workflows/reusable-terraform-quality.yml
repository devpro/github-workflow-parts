name: Reusable - Terraform validate

on:
  workflow_call:
    inputs:
      job-name:
        description: "Job name"
        type: string
        required: false
        default: "Validate"
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 30
      working-directory:
        description: "Working directory"
        type: string
        required: false
        default: "."
      operating-system:
        description: "Operating system executing the runner"
        type: string
        required: false
        default: "ubuntu-latest"
      workflow-parts-version:
        description: "GitHub workflow parts version (branch/tag/SHA). Should match the ref/tag/SHA the caller pinned for this reusable workflow itself. Ignored when the caller is this repository, whose checkout already holds the actions under test."
        type: string
        required: false
        default: "main"

jobs:
  terraform-validate:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # The caller being this repository, the actions under test are those of the commit under test.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: Install terraform
        uses: ./workflow-parts/actions/terraform/setup
      - name: Check Terraform format
        run: terraform fmt -recursive -check
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate
      # Checkov is a static code analysis tool for infrastructure as code (IaC) and also a software composition analysis (SCA) tool for images and open source packages
      - name: Run Checkov
        run: |
          pipx run --spec checkov==3.3.30 checkov -d . \
            --soft-fail \
            --output cli --output sarif \
            --output-file-path console,results.sarif
        continue-on-error: true
      # needs GitHub code security > code scanning, not available on private repos
      # - name: Upload SARIF file
      #   uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      #   if: success() || failure()
      #   with:
      #     sarif_file: results.sarif
      # TFLint is a pluggable terraform linter (ref. https://github.com/terraform-linters/tflint)
      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('**/.tflint.hcl') }}
      - name: Setup TFLint
        uses: ./workflow-parts/actions/tflint/setup
        with:
          # ref. https://github.com/terraform-linters/tflint/releases
          tflint-version: v0.65.0
      - name: Initialize TFLint
        run: tflint --init --recursive
        env:
          # ref. https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run TFLint
        run: tflint --recursive --format compact
      - name: Run Trivy IaC scan
        uses: ./workflow-parts/actions/trivy/scan
        with:
          scan-type: config
          target: .
          format: sarif
          output-file: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-results
          path: |
            results.sarif
            trivy-results.sarif
          retention-days: 14
    env:
      TF_IN_AUTOMATION: true
