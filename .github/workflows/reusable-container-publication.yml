name: Reusable - Container publication
# description: |
#   Builds a new container image with Docker and pushes it to a registry.
#   Builds without a push when push is false, so that a CI pipeline can test the build without credentials.
#   Requires these permissions for Cosign:
#   ```
#   permissions:
#     id-token: write
#     contents: read
#   ```

on:
  workflow_call:
    inputs:
      container-registry:
        description: Container registry
        type: string
        required: false
        default: "docker.io"
      push:
        description: >-
          Push the images and create the tag.
          When false, only build the images, without the registry credentials.
        type: boolean
        required: false
        default: true
      scan:
        description: >-
          Scan the Windows image with Grype after the build, and fail on a critical vulnerability.
          Requires push to be false, because the runner does not keep a pushed image.
        type: boolean
        required: false
        default: false
      scan-path:
        description: >-
          Folder of the Windows image to scan (for example C:\app), which takes seconds.
          Scans the full image when empty, which takes minutes.
        type: string
        required: false
        default: ""
      create-latest:
        description: Also create the latest tag
        type: boolean
        required: false
        default: false
      extra-build-arguments:
        description: Container build additional arguments
        type: string
        required: false
        default: ""
      image-definition:
        description: Path to the container definition file (Dockerfile, Containerfile)
        type: string
        required: true
      image-name:
        description: Image name
        type: string
        required: true
      image-path:
        description: Image path
        type: string
        required: true
      image-tag:
        description: Image tag
        type: string
        required: true
      image-platform:
        description: >-
          Linux platforms to build on the operating-system runner, with QEMU emulation.
          Ignored when arm64-runner is set.
          Builds no Linux image when empty.
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
      arm64-runner:
        description: >-
          Runner label to build linux/arm64 without emulation (for example "ubuntu-24.04-arm").
          The operating-system runner then builds linux/amd64, and image-platform is ignored.
        type: string
        required: false
        default: ""
      windows-runner:
        description: >-
          Windows runner label to build windows/amd64 (for example "windows-2025"), for the Windows version of that runner.
          Adds the Windows image to the same tag as the Linux platforms.
          Builds no Windows image when empty.
        type: string
        required: false
        default: ""
      job-name:
        description: Job name
        type: string
        required: false
        default: Publication
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 60
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      workflow-parts-version:
        description: >-
          GitHub workflow parts version (branch/tag/SHA).
          Use the same version as the one that calls this reusable workflow.
          Ignored when this repository is the caller, because it tests the actions of the current commit.
        type: string
        required: false
        default: main
      working-directory:
        description: Working directory
        type: string
        required: false
        default: "."
    secrets:
      container-registry-username:
        description: Container registry username, required to push
        required: false
      container-registry-password:
        description: Container registry password, required to push
        required: false
      secret-vars:
        description: "Additional environment variables"
        required: false

jobs:
  build-emulated:
    name: ${{ inputs.job-name }} build (emulated)
    if: ${{ inputs.arm64-runner == '' && inputs.image-platform != '' }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Set secret variables
        shell: bash
        env:
          SECRET_VARS: ${{ secrets.secret-vars }}
        run: |
          if [[ -n "$SECRET_VARS" ]]; then
            echo "$SECRET_VARS" | while IFS='=' read -r _ val; do
              if [[ -n "$val" ]]; then
                echo "::add-mask::$val"
              fi
            done
            echo "$SECRET_VARS" >> "$GITHUB_ENV"
          fi
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Login to container registry
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.container-registry }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Set up QEMU
        # Sets up emulation only when a platform is different from the platform of the runner.
        if: ${{ inputs.image-platform != 'linux/amd64' }}
        uses: ./workflow-parts/actions/qemu/setup
        with:
          platforms: ${{ inputs.image-platform }}
      # Creates one tag for all Linux platforms after each platform is pushed.
      # Uses a separate Linux tag when there is a Windows image, because the publication job combines them later.
      - name: Build and push container image
        id: build
        uses: ./workflow-parts/actions/container/build-push
        with:
          push: ${{ inputs.push }}
          image-definition: ${{ inputs.image-definition }}
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          image-tag: ${{ inputs.windows-runner != '' && format('{0}-linux', inputs.image-tag) || inputs.image-tag }}
          platforms: ${{ inputs.image-platform }}
          build-arguments: ${{ inputs.extra-build-arguments }}
          working-directory: ${{ inputs.working-directory }}

  build-amd64:
    name: ${{ inputs.job-name }} build (linux/amd64)
    if: ${{ inputs.arm64-runner != '' }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Set secret variables
        shell: bash
        env:
          SECRET_VARS: ${{ secrets.secret-vars }}
        run: |
          if [[ -n "$SECRET_VARS" ]]; then
            echo "$SECRET_VARS" | while IFS='=' read -r _ val; do
              if [[ -n "$val" ]]; then
                echo "::add-mask::$val"
              fi
            done
            echo "$SECRET_VARS" >> "$GITHUB_ENV"
          fi
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Login to container registry
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.container-registry }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push container image under the tag of its platform
        id: build
        uses: ./workflow-parts/actions/container/build-push
        with:
          push: ${{ inputs.push }}
          image-definition: ${{ inputs.image-definition }}
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          image-tag: ${{ inputs.image-tag }}-linux-amd64
          platforms: linux/amd64
          build-arguments: ${{ inputs.extra-build-arguments }}
          working-directory: ${{ inputs.working-directory }}

  build-arm64:
    name: ${{ inputs.job-name }} build (linux/arm64)
    if: ${{ inputs.arm64-runner != '' }}
    runs-on: ${{ inputs.arm64-runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Set secret variables
        shell: bash
        env:
          SECRET_VARS: ${{ secrets.secret-vars }}
        run: |
          if [[ -n "$SECRET_VARS" ]]; then
            echo "$SECRET_VARS" | while IFS='=' read -r _ val; do
              if [[ -n "$val" ]]; then
                echo "::add-mask::$val"
              fi
            done
            echo "$SECRET_VARS" >> "$GITHUB_ENV"
          fi
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Login to container registry
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.container-registry }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push container image under the tag of its platform
        id: build
        uses: ./workflow-parts/actions/container/build-push
        with:
          push: ${{ inputs.push }}
          image-definition: ${{ inputs.image-definition }}
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          image-tag: ${{ inputs.image-tag }}-linux-arm64
          platforms: linux/arm64
          build-arguments: ${{ inputs.extra-build-arguments }}
          working-directory: ${{ inputs.working-directory }}

  # Builds on a Windows runner, because the Windows engine can build only for its own platform and Windows version.
  build-windows:
    name: ${{ inputs.job-name }} build (windows/amd64)
    if: ${{ inputs.windows-runner != '' }}
    runs-on: ${{ inputs.windows-runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Login to container registry
        if: ${{ inputs.push }}
        shell: pwsh
        env:
          REGISTRY: ${{ inputs.container-registry }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: |
          $env:REGISTRY_PASSWORD | docker login $env:REGISTRY --username $env:REGISTRY_USERNAME --password-stdin
          exit $LASTEXITCODE
      - name: Build and push container image under the tag of its platform
        id: build
        uses: ./workflow-parts/actions/container/build-push
        with:
          push: ${{ inputs.push }}
          image-definition: ${{ inputs.image-definition }}
          image-repository: ${{ env.IMAGE_REPOSITORY }}
          image-tag: ${{ inputs.image-tag }}-windows-amd64
          platforms: windows/amd64
          build-arguments: ${{ inputs.extra-build-arguments }}
          working-directory: ${{ inputs.working-directory }}
      # Uses Grype, because Trivy finds no packages in a Windows image.
      # Grype reads the version of each .NET assembly and each Windows binary.
      - name: Scan container image with Grype
        if: ${{ inputs.scan }}
        uses: ./workflow-parts/actions/grype/scan
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ inputs.image-tag }}-windows-amd64
          image-path: ${{ inputs.scan-path }}

  # Creates the tag after all platform builds finish, so that the tag never points to an incomplete image.
  publication:
    name: ${{ inputs.job-name }}
    needs: [build-emulated, build-amd64, build-arm64, build-windows]
    # Replaces the default success() condition, because success() does not accept the build jobs that are skipped on purpose.
    if: ${{ inputs.push && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Login to container registry
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.container-registry }}
          REGISTRY_USERNAME: ${{ secrets.container-registry-username }}
          REGISTRY_PASSWORD: ${{ secrets.container-registry-password }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Tag the image of every platform
        if: ${{ inputs.arm64-runner != '' || inputs.windows-runner != '' }}
        env:
          # Combines only the builds that ran, because a skipped build gives no digest.
          DIGESTS: >-
            ${{ needs.build-amd64.outputs.digest }} ${{ needs.build-arm64.outputs.digest }}
            ${{ inputs.windows-runner != '' && needs.build-emulated.outputs.digest || '' }} ${{ needs.build-windows.outputs.digest }}
        run: |
          sources=()
          for digest in $DIGESTS; do
            sources+=("${IMAGE_REPOSITORY}@${digest}")
          done
          docker buildx imagetools create --tag "$IMAGE_REF" "${sources[@]}"
      - name: Generate SBOM with Syft
        uses: ./workflow-parts/actions/syft/generate-sbom
        continue-on-error: true
        with:
          target-image: ${{ env.IMAGE_REF }}
      - name: Push latest tag
        if: ${{ inputs.create-latest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE_REF_LATEST" "$IMAGE_REF"
      - name: Sign container image with Cosign
        uses: ./workflow-parts/actions/cosign/sign
        with:
          image-name: ${{ inputs.image-name }}
          image-path: ${{ inputs.image-path }}
          image-tag: ${{ inputs.image-tag }}

env:
  IMAGE_REPOSITORY: ${{ inputs.image-path }}/${{ inputs.image-name }}
  IMAGE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
  IMAGE_REF_LATEST: ${{ inputs.image-path }}/${{ inputs.image-name }}:latest
