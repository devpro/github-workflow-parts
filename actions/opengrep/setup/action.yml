name: Setup Opengrep
description: |
  Installs Opengrep by downloading the official binary from its GitHub release and verifying its SHA256 checksum, pinned here since the release publishes signatures but no checksum file
  (replacement for its install.sh, which a pipeline would run from the main branch of the project, unpinned).
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  opengrep-version:
    description: Version of Opengrep to install (check latest from https://github.com/opengrep/opengrep/releases)
    required: false
    default: "v1.33.1"
  opengrep-sha256:
    description: SHA256 of the Opengrep binary for x64, given with any other opengrep-version, since its release publishes no checksum file
    required: false
    default: "46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808"  # v1.33.1
  opengrep-sha256-arm64:
    description: SHA256 of the Opengrep binary for arm64, given with any other opengrep-version
    required: false
    default: "d1433f63a90b8bc0b6ad4b498a13b372b856ce9a754a43484ba4920fe2d76dcf"  # v1.33.1

runs:
  using: "composite"
  steps:
    - name: Install Opengrep
      shell: bash
      env:
        OPENGREP_VERSION: ${{ inputs.opengrep-version }}
        OPENGREP_BINARY: opengrep_manylinux_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86' }}
        OPENGREP_SHA256: ${{ runner.arch == 'ARM64' && inputs.opengrep-sha256-arm64 || inputs.opengrep-sha256 }}
      run: |
        # Downloaded into a directory of its own, since the repository may hold a file or a directory named like the binary.
        cd "$(mktemp -d)"
        curl -fsSL -O "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${OPENGREP_BINARY}"
        echo "${OPENGREP_SHA256}  ${OPENGREP_BINARY}" | sha256sum --check --status
        # Installed where the job owns the directory, so neither root nor sudo is needed, on a hosted runner or in a container.
        mkdir -p "${RUNNER_TEMP}/bin"
        install -m 0755 "${OPENGREP_BINARY}" "${RUNNER_TEMP}/bin/opengrep"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/opengrep" --version
