name: Setup Opengrep
description: |
  Installs Opengrep by downloading the official binary from its GitHub release and verifying its SHA256 checksum.
  The checksum is pinned here, because the release contains signatures but no checksum file.
  Replaces install.sh, because a pipeline would run it from the main branch of the project, without a pinned version.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  opengrep-version:
    description: Version of Opengrep to install (check latest from https://github.com/opengrep/opengrep/releases)
    required: false
    default: "v2.0.0"
  opengrep-sha256:
    description: >-
      SHA256 of the Opengrep binary for x64.
      Required when opengrep-version changes, because the release contains no checksum file.
    required: false
    default: "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0"  # v2.0.0
  opengrep-sha256-arm64:
    description: SHA256 of the Opengrep binary for arm64, required when opengrep-version changes
    required: false
    default: "6257b65423a744b704af2ff9beeb8f222c2f6925236af386b56b031d4c06d6d8"  # v2.0.0

runs:
  using: "composite"
  steps:
    - name: Install Opengrep
      shell: bash
      env:
        OPENGREP_VERSION: ${{ inputs.opengrep-version }}
        OPENGREP_BINARY: opengrep_linux_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86' }}
        OPENGREP_SHA256: ${{ runner.arch == 'ARM64' && inputs.opengrep-sha256-arm64 || inputs.opengrep-sha256 }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        curl -fsSL -O "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${OPENGREP_BINARY}"
        echo "${OPENGREP_SHA256}  ${OPENGREP_BINARY}" | sha256sum --check --status
        # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
        mkdir -p "${RUNNER_TEMP}/bin"
        install -m 0755 "${OPENGREP_BINARY}" "${RUNNER_TEMP}/bin/opengrep"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/opengrep" --version
