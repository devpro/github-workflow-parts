name: Setup helm-unittest
description: |
  Installs untt, the standalone binary of helm-unittest, so that Helm needs no plugin.
  Downloads the official release and verifies its SHA256 checksum.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  helm-unittest-version:
    description: Version of helm-unittest to install, without the v prefix (check latest from https://github.com/helm-unittest/helm-unittest/releases)
    required: false
    default: "1.3.0"

runs:
  using: "composite"
  steps:
    - name: Install helm-unittest
      shell: bash
      env:
        HELM_UNITTEST_VERSION: ${{ inputs.helm-unittest-version }}
        HELM_UNITTEST_PLATFORM: linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}"
        archive="helm-unittest-${HELM_UNITTEST_PLATFORM}-${HELM_UNITTEST_VERSION}.tgz"
        curl -fsSL -O "${BASE_URL}/${archive}"
        curl -fsSL -O "${BASE_URL}/helm-unittest-checksum.sha"
        # Looks for ./_dist/<archive>, because the checksum file contains the build path of each archive.
        checksum="$(grep "/${archive}$" helm-unittest-checksum.sha | cut -d ' ' -f 1)"
        echo "${checksum}  ${archive}" | sha256sum --check --status
        tar -xzf "${archive}" "untt-${HELM_UNITTEST_PLATFORM}"
        # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
        mkdir -p "${RUNNER_TEMP}/bin"
        mv "untt-${HELM_UNITTEST_PLATFORM}" "${RUNNER_TEMP}/bin/untt"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        # Checks only that untt starts, because it has no version flag.
        "${RUNNER_TEMP}/bin/untt" --help > /dev/null
