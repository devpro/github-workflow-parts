name: Setup CodeQL
description: |
  Installs the CodeQL CLI and its standard query packs from the official CodeQL bundle, and verifies the SHA256 checksum.
  Use it in a job that runs CodeQL without github/codeql-action.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  codeql-version:
    description: Version of the CodeQL bundle to install, without the v prefix (check latest from https://github.com/github/codeql-action/releases)
    required: false
    default: "2.27.6"

runs:
  using: "composite"
  steps:
    - name: Install CodeQL
      shell: bash
      env:
        CODEQL_VERSION: ${{ inputs.codeql-version }}
        CODEQL_BUNDLE: codeql-bundle-${{ runner.arch == 'ARM64' && 'linux-arm64' || 'linux64' }}.tar.gz
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the bundle.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}"
        curl -fsSL -O "${BASE_URL}/${CODEQL_BUNDLE}"
        curl -fsSL -O "${BASE_URL}/${CODEQL_BUNDLE}.checksum.txt"
        sha256sum --check --status "${CODEQL_BUNDLE}.checksum.txt"
        # Keeps the full codeql directory, because the CLI looks for its query packs in that directory.
        rm -rf "${RUNNER_TEMP}/codeql"
        tar -xzf "${CODEQL_BUNDLE}" -C "${RUNNER_TEMP}"
        rm -f "${CODEQL_BUNDLE}" "${CODEQL_BUNDLE}.checksum.txt"
        echo "${RUNNER_TEMP}/codeql" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/codeql/codeql" version --format=terse
