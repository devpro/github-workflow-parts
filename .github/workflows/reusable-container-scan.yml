name: Reusable - Container scan

on:
  workflow_call:
    inputs:
      base-image-argument:
        description: Build argument the image definition reads the base image from
        type: string
        required: false
        default: BASE_IMAGE
      base-image-definition:
        description: Path to the definition of the image this one is built on, built first so that the scan reads what this commit produces rather than a published base
        type: string
        required: false
        default: ""
      image-definition:
        description: Path to the container definition file (Dockerfile, Containerfile)
        type: string
        required: true
      image-name:
        description: Image name
        type: string
        required: true
      image-path:
        description: Image path
        type: string
        required: true
      image-tag:
        description: Image tag
        type: string
        required: true
      job-name:
        description: Job name
        type: string
        required: false
        default: Scan
      max-high-cves:
        description: Maximum number of high CVEs authorized
        type: number
        required: false
        default: 0
      max-medium-cves:
        description: Maximum number of medium CVEs authorized
        type: number
        required: false
        default: 0
      neuvector-enabled:
        description: "Use NeuVector to scan the image?"
        type: boolean
        required: false
        default: false
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      trivy-enabled:
        description: "Use Trivy to scan the image?"
        type: boolean
        required: false
        default: true
      workflow-parts-version:
        description: "GitHub workflow parts version (branch/tag/SHA). Should match the ref/tag/SHA the caller pinned for this reusable workflow itself. Ignored when the caller is this repository, whose checkout already holds the actions under test."
        type: string
        required: false
        default: "main"
      working-directory:
        description: Working directory
        type: string
        required: false
        default: "."

jobs:
  container-scan:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # The caller being this repository, the actions under test are those of the commit under test.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
      # A scan judges what a clean build produces today.
      # A cached `apt-get upgrade` layer or a stale base image keeps an already fixed package version, on a runner whose Docker daemon outlives the job.
      - name: Build base container image
        if: ${{ inputs.base-image-definition != '' }}
        run: docker build . --pull --no-cache --file "$BASE_DEFINITION" --tag "$BASE_REF"
        shell: bash
        env:
          BASE_DEFINITION: ${{ inputs.base-image-definition }}
      # An image built on the base above reads it from the local daemon, which a pull would look for in a registry that has never seen it.
      - name: Build container image
        run: |
          args=(--no-cache --file "$IMAGE_DEFINITION" --tag "$IMAGE_REF")
          if [ -n "$BASE_DEFINITION" ]; then
            args+=(--build-arg "${BASE_ARGUMENT}=${BASE_REF}")
          else
            args+=(--pull)
          fi
          docker build . "${args[@]}"
        shell: bash
        env:
          BASE_ARGUMENT: ${{ inputs.base-image-argument }}
          BASE_DEFINITION: ${{ inputs.base-image-definition }}
          IMAGE_DEFINITION: ${{ inputs.image-definition }}
      # deactivated 2026-02-22: "Build container for action use... process "/bin/sh -c zypper in -y jq docker && zypper clean" did not complete successfully: exit code: 8"
      # - name: Scan container image with NeuVector
      #   if: ${{ inputs.neuvector-enabled }}
      #   uses: neuvector/scan-action@196964fb269cfcd1fe139dd27c8440a8396bd8ab # 1.0.0
      #   with:
      #     image-repository: ${{ inputs.image-path }}/${{ inputs.image-name }}
      #     image-tag: ${{ inputs.image-tag }}
      #     min-high-cves-to-fail: '${{ inputs.max-high-cves }}'
      #     min-medium-cves-to-fail: '${{ inputs.max-medium-cves }}'
      #     nv-scanner-image: neuvector/scanner:5
      - name: Scan container image with Trivy
        if: ${{ inputs.trivy-enabled }}
        uses: ./workflow-parts/actions/trivy/scan
        with:
          scan-type: image
          target: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          pkg-types: os,library
          severity: CRITICAL,HIGH
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IMAGE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
      BASE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}-base:${{ inputs.image-tag }}
