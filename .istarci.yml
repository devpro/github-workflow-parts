# IstarCI configuration, read from the root of the repository.

runner:
  # The .NET jobs need the SDK, which a hosted runner has and the default image does not.
  images:
    "test-dotnet-*": ghcr.io/devpro/ubuntu-dotnet:latest
  # The container scan workflow builds an image through the host Docker daemon, as a hosted runner does, and Cosign reads a digest with the Docker CLI.
  docker: ["test-container-scan-on-base*", "test-cosign-sign*"]
