name: Setup helm-unittest
description: |
  Installs untt, the standalone binary of the helm-unittest plugin, so no plugin is installed into Helm,
  by downloading the official release and verifying its SHA256 checksum.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  helm-unittest-version:
    description: Version of helm-unittest to install, without its leading v (check latest from https://github.com/helm-unittest/helm-unittest/releases)
    required: false
    default: "1.2.1"

runs:
  using: "composite"
  steps:
    - name: Install helm-unittest
      shell: bash
      env:
        HELM_UNITTEST_VERSION: ${{ inputs.helm-unittest-version }}
        HELM_UNITTEST_PLATFORM: linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      run: |
        # Downloaded into a directory of its own, since the repository may hold a file or a directory named like the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}"
        archive="helm-unittest-${HELM_UNITTEST_PLATFORM}-${HELM_UNITTEST_VERSION}.tgz"
        curl -fsSL -O "${BASE_URL}/${archive}"
        curl -fsSL -O "${BASE_URL}/helm-unittest-checksum.sha"
        # The checksum file names each archive by the path it was built at, ./_dist/<archive>.
        checksum="$(grep "/${archive}$" helm-unittest-checksum.sha | cut -d ' ' -f 1)"
        echo "${checksum}  ${archive}" | sha256sum --check --status
        tar -xzf "${archive}" "untt-${HELM_UNITTEST_PLATFORM}"
        # Installed where the job owns the directory, so neither root nor sudo is needed, on a hosted runner or in a container.
        mkdir -p "${RUNNER_TEMP}/bin"
        mv "untt-${HELM_UNITTEST_PLATFORM}" "${RUNNER_TEMP}/bin/untt"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        # untt has no version flag, so it is only checked to run.
        "${RUNNER_TEMP}/bin/untt" --help > /dev/null
