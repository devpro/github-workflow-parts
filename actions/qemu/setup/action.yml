name: Setup QEMU
description: |
  Registers QEMU user emulation, so that Docker can build and run images for other platforms.
  Installs the qemu-user-static package of Ubuntu (qemu-user-binfmt since Ubuntu 26.04), which apt verifies.
  Replaces docker/setup-qemu-action and its tonistiigi/binfmt image, so that no third-party image runs with privileges.
  Ubuntu runners only (for example ubuntu-latest), with sudo, because the registration is in the kernel.

inputs:
  platforms:
    description: Comma-separated platforms that must have emulation, with the Docker names (for example "linux/arm64,linux/arm/v7")
    required: false
    default: "linux/arm64"

runs:
  using: "composite"
  steps:
    - name: Install QEMU
      shell: bash
      run: |
        sudo apt-get update -qq
        # Selects the package by what apt has, because qemu-user-static is a virtual package since QEMU 9.1 (Ubuntu 26.04).
        # apt cannot install a virtual package, and qemu-user now contains the static binaries.
        package=qemu-user-static
        if apt-cache show --no-all-versions qemu-user-binfmt | grep -q '^Provides:.*\bqemu-user-static\b'; then
          package=qemu-user-binfmt
        fi
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$package"
        # Loads the registrations that the package puts in binfmt.d into the kernel.
        sudo /usr/lib/systemd/systemd-binfmt
    - name: Check the emulation of each platform
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        IFS=',' read -ra requested <<< "$PLATFORMS"
        for platform in "${requested[@]}"; do
          platform="${platform// /}"
          case "$platform" in
            linux/amd64|linux/386) continue ;;
            linux/arm64*) name=aarch64 ;;
            linux/arm/*) name=arm ;;
            linux/ppc64le) name=ppc64le ;;
            linux/riscv64) name=riscv64 ;;
            linux/s390x) name=s390x ;;
            *) echo "ERROR: No QEMU emulation known for ${platform}" >&2; exit 1 ;;
          esac
          registration="/proc/sys/fs/binfmt_misc/qemu-${name}"
          # Requires the F flag, which opens the interpreter at registration.
          # Without this flag, a container must have the interpreter in its file system.
          if ! grep -qx enabled "$registration" 2>/dev/null || ! grep -q '^flags: .*F' "$registration"; then
            echo "ERROR: ${platform} is not emulated: ${registration} is missing, disabled or without the F flag" >&2
            exit 1
          fi
          echo "${platform} is emulated by $(grep '^interpreter' "$registration")"
        done
