name: Install Playwright browsers
description: |
  Installs the browsers for the Playwright version of the project, and their system packages on a hosted runner.
  Run it after the dependencies are installed (npm ci), because the browsers must match the Playwright version.
  System packages need root access: a hosted runner uses sudo, and the image of a container job must already contain them.

inputs:
  browsers:
    description: Browsers to install, separated by spaces
    required: false
    default: chromium
  working-directory:
    description: Directory of the project that uses Playwright
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install the system packages of the browsers
      if: runner.environment == 'github-hosted'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browser_list <<< "$BROWSERS"
        npx --no-install playwright install-deps "${browser_list[@]}"
    - name: Install the browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browser_list <<< "$BROWSERS"
        npx --no-install playwright install "${browser_list[@]}"
