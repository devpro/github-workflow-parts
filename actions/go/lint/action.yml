name: Lint Go code
description: |
  Checks a Go module with only the Go toolchain: gofmt, go mod tidy and go vet.
  Requires Go 1.23 or later on the path, from actions/setup-go or the image of the job.

inputs:
  working-directory:
    description: >-
      Directory of the Go module (go.mod), relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Check formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "ERROR: Files not formatted by gofmt, which gofmt -w fixes:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    # Finds missing and unused requirements now, so that they do not cause a problem in the next build.
    - name: Check go.mod and go.sum are tidy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod tidy -diff
    - name: Vet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go vet ./...
