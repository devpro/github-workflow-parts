name: Build, Test & Analyze
description: Builds, runs tests on a .NET codebase and run analysis with Sonar

inputs:
  dotnet-test-args:
    description: .NET test arguments
    required: false
    default: ""
  java-version:
    description: Java version that will be installed (for Sonar CLI)
    required: false
    default: "21"
  sonar-cpd-exclusions:
    description: Files or directories that should be excluded from Sonar code duplication analysis
    required: false
    default: "**/*Generated*.cs"
  sonar-exclusions:
    description: Files or directories that should be excluded from Sonar analysis
    required: false
    default: "**/node_modules/**"
  report-folder:
    description: Folder where report files will be generated
    required: false
    default: report
  sonar-host-url:
    description: Sonar host URL
    required: false
    default: ""
  sonar-organization:
    description: Sonar organization
    required: false
    default: ""
  sonar-project-key:
    description: Sonar project key
    required: false
    default: ""
  sonar-project-name:
    description: Sonar project name
    required: false
    default: ""
  sonar-settings-file:
    description: SonarQube.Analysis.xml file of the repository, relative to the working directory, holding analysis settings such as issue exclusions
    required: false
    default: ""
  sonarscanner-version:
    description: Version of the Sonar scanner for .NET (check latest from https://www.nuget.org/packages/dotnet-sonarscanner)
    required: false
    default: "12.0.0"
  sonar-token:
    description: Sonar token for login
    required: false
    default: ""
  working-directory:
    description: Directory of the .NET code, relative to the workspace, which a composite action does not take from the defaults of the calling job
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up JDK for Sonar
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "zulu"
    # The analyzers Sonar downloads land in its user home.
    - name: Cache Sonar packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    # Keyed by version with no fallback, since a scanner restored from another key would be another version.
    - name: Cache Sonar scanner
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner-${{ inputs.sonarscanner-version }}
    - name: Install Sonar scanner
      if: ${{ steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool install dotnet-sonarscanner --tool-path ./.sonar/scanner --version "$SONARSCANNER_VERSION"
      shell: bash
      env:
        SONARSCANNER_VERSION: ${{ inputs.sonarscanner-version }}
    - name: Start code analysis
      run: |
        args=(
          /k:"$SONAR_PROJECT_KEY"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="$SONAR_HOST_URL"
          /d:sonar.cpd.exclusions="$REPORT_FOLDER/**,$SONAR_CPD_EXCLUSIONS"
          /d:sonar.exclusions="$REPORT_FOLDER/**,$SONAR_EXCLUSIONS"
          /d:sonar.coverageReportPaths="$REPORT_FOLDER/SonarQube.xml"
          /d:sonar.cs.vstest.reportsPaths="$REPORT_FOLDER/TestResults/*.trx"
        )
        # SonarCloud needs an organization, which a SonarQube server has no notion of.
        if [ -n "$SONAR_ORGANIZATION" ]; then
          args+=(/o:"$SONAR_ORGANIZATION")
        fi
        if [ -n "$SONAR_PROJECT_NAME" ]; then
          args+=(/n:"$SONAR_PROJECT_NAME")
        fi
        # The scanner for .NET never reads a sonar-project.properties, so a settings file passed with /s: is how a repository versions its own settings.
        # The path is made absolute, since the scanner resolves a relative one against its own .sonarqube folder.
        if [ -n "$SONAR_SETTINGS_FILE" ]; then
          args+=(/s:"$(realpath "$SONAR_SETTINGS_FILE")")
        fi
        "$GITHUB_WORKSPACE/.sonar/scanner/dotnet-sonarscanner" begin "${args[@]}"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_FOLDER: ${{ inputs.report-folder }}
        SONAR_CPD_EXCLUSIONS: ${{ inputs.sonar-cpd-exclusions }}
        SONAR_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}
        SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        SONAR_PROJECT_NAME: ${{ inputs.sonar-project-name }}
        SONAR_SETTINGS_FILE: ${{ inputs.sonar-settings-file }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
    - name: Build .NET solution
      run: dotnet build --no-restore --configuration Debug
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
        BUILD_BUILDID: ${{ github.run_id }}
    - name: Run tests
      # Shell words by contract, quotes included, parsed from a variable rather than pasted into the script by GitHub.
      run: |
        test_args=()
        eval "test_args=(${DOTNET_TEST_ARGS})"
        dotnet test --no-build --verbosity normal --configuration Debug \
          --results-directory "$REPORT_FOLDER/TestResults" \
          "${test_args[@]}"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ASPNETCORE_ENVIRONMENT: Development
        DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
        REPORT_FOLDER: ${{ inputs.report-folder }}
    # Microsoft.Testing.Platform writes the coverage beside the results, and VSTest in a folder of its own for each run.
    - name: Generate test report
      if: ${{ always() && hashFiles(format('{0}/{1}/TestResults/**/*.cobertura.xml', inputs.working-directory, inputs.report-folder)) != '' }}
      run: |
        reportgenerator "-reports:$REPORT_FOLDER/TestResults/**/*.cobertura.xml" \
          "-targetdir:$REPORT_FOLDER" \
          "-reporttypes:Cobertura;Html;TextSummary;SonarQube"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_FOLDER: ${{ inputs.report-folder }}
    - name: Complete code analysis
      run: '"$GITHUB_WORKSPACE/.sonar/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
