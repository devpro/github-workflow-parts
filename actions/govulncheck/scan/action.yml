name: Scan Go code with govulncheck
description: |
  Installs govulncheck, the vulnerability checker of the Go team, with go install.
  go install verifies the module with the Go checksum database.
  Reports the known vulnerabilities in the code that the module calls, and fails if there is one.
  Requires Go on the path, from actions/setup-go or the image of the job.

inputs:
  govulncheck-version:
    description: Version of govulncheck to install (check latest from https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck?tab=versions)
    required: false
    default: "v1.10.0"
  working-directory:
    description: >-
      Directory of the Go module (go.mod), relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install govulncheck
      shell: bash
      env:
        GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
      run: |
        # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
        mkdir -p "${RUNNER_TEMP}/bin"
        GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/govulncheck" -version
    - name: Scan with govulncheck
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: govulncheck ./...
