name: Build & Test
description: Builds and runs tests on a .NET codebase

inputs:
  dotnet-test-args:
    description: .NET test arguments
    required: false
    default: ""
  report-folder:
    description: Folder where report files will be generated
    required: false
    default: report
  working-directory:
    description: Directory of the .NET code, relative to the workspace, which a composite action does not take from the defaults of the calling job
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Build .NET code
      run: dotnet build --no-restore --configuration Debug
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
        BUILD_BUILDID: ${{ github.run_id }}
    - name: Run tests
      run: |
        dotnet test --no-build --verbosity normal --configuration Debug \
          --results-directory "$REPORT_FOLDER/TestResults" \
          ${{ inputs.dotnet-test-args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ASPNETCORE_ENVIRONMENT: Development
        REPORT_FOLDER: ${{ inputs.report-folder }}
    # Microsoft.Testing.Platform writes the coverage beside the results, and VSTest in a folder of its own for each run.
    - name: Generate test report
      if: ${{ always() && hashFiles(format('{0}/{1}/TestResults/**/*.cobertura.xml', inputs.working-directory, inputs.report-folder)) != '' }}
      run: |
        reportgenerator "-reports:$REPORT_FOLDER/TestResults/**/*.cobertura.xml" \
          "-targetdir:$REPORT_FOLDER" \
          "-reporttypes:Cobertura;Html;TextSummary"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_FOLDER: ${{ inputs.report-folder }}
