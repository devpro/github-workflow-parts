name: Reusable - .NET quality

on:
  workflow_call:
    inputs:
      custom-commands:
        description: "Optional shell commands to run before build & test"
        type: string
        required: false
        default: ""
      dotnet-test-args:
        description: ".NET test arguments (for example \"--report-xunit-trx --coverage --coverage-output-format cobertura\")"
        type: string
        required: false
        default: ""
      dotnet-version:
        description: .NET version
        type: string
        required: false
        default: "10.0"
      extra-vars:
        description: "Additional environment variables at the start of the pipeline"
        type: string
        required: false
        default: ""
      fossa-enabled:
        description: Enable the license compliance check with FOSSA
        type: boolean
        required: false
        default: false
      fossa-test:
        description: Run FOSSA test on PR
        type: boolean
        required: false
        default: false
      mongodb-enabled:
        description: >-
          Start a local MongoDB server on 127.0.0.1:27017 before build and test, with mongosh on the path.
          Uses the single-node replica set rs0, because transactions require a replica set.
        type: boolean
        required: false
        default: false
      mongodb-version:
        description: >-
          Version of the MongoDB server (for example an 8.0 version) when mongodb-enabled is true.
          Uses the default version of the MongoDB action when empty.
        type: string
        required: false
        default: ""
      job-name:
        description: Job name
        type: string
        required: false
        default: Quality
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 60
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      sonar-enabled:
        description: Enable the analysis with Sonar (SonarQube or SonarCloud)
        type: boolean
        required: false
        default: false
      sonar-cpd-exclusions:
        description: Files or directories to exclude from the Sonar code duplication analysis
        type: string
        required: false
        default: "**/*Generated*.cs"
      sonar-exclusions:
        description: Files or directories to exclude from the Sonar analysis
        type: string
        required: false
        default: "node_modules"
      sonar-host-url:
        description: Sonar host URL
        type: string
        required: false
        default: "https://sonarcloud.io"
      sonar-organization:
        description: Sonar organization
        type: string
        required: false
        default: ""
      sonar-project-key:
        description: Sonar project key
        type: string
        required: false
        default: ""
      sonar-project-name:
        description: Sonar project name
        type: string
        required: false
        default: ""
      sonar-settings-file:
        description: SonarQube.Analysis.xml file with analysis settings such as issue exclusions, relative to the working directory
        type: string
        required: false
        default: ""
      workflow-parts-version:
        description: >-
          GitHub workflow parts version (branch/tag/SHA).
          Use the same version as the one that calls this reusable workflow.
          Ignored when this repository is the caller, because it tests the actions of the current commit.
        type: string
        required: false
        default: main
      working-directory:
        description: Working directory
        type: string
        required: false
        default: "."
    secrets:
      fossa-api-key:
        description: FOSSA API key
        required: false
      sonar-token:
        description: Sonar token for login
        required: false
      additional-vars:
        description: "Additional variables"
        required: false

jobs:
  dotnet-quality:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Set additional variables
        shell: bash
        # Runs at the root of the workspace, because the working directory does not exist before the clone.
        working-directory: .
        env:
          EXTRA_VARS: ${{ inputs.extra-vars }}
        run: |
          if [[ -n "$EXTRA_VARS" ]]; then
            echo "$EXTRA_VARS" >> "$GITHUB_ENV"
          fi
      - name: Set additional secrets
        shell: bash
        # Runs at the root of the workspace, because the working directory does not exist before the clone.
        working-directory: .
        env:
          ADDITIONAL_VARS: ${{ secrets.additional-vars }}
        run: |
          if [[ -n "$ADDITIONAL_VARS" ]]; then
            echo "$ADDITIONAL_VARS" | while IFS='=' read -r _ val; do
              if [[ -n "$val" ]]; then
                echo "::add-mask::$val"
              fi
            done
            echo "$ADDITIONAL_VARS" >> "$GITHUB_ENV"
          fi
      - name: Disable git autocrlf
        if: ${{ inputs.operating-system == 'windows-latest' }}
        run: git config --global core.autocrlf false
        shell: bash
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Install .NET & lint
        uses: ./workflow-parts/actions/dotnet/install-lint-restore
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Start MongoDB
        if: ${{ inputs.mongodb-enabled }}
        uses: ./workflow-parts/actions/mongodb/start
        with:
          replica-set: rs0
          mongodb-version: ${{ inputs.mongodb-version }}
      - name: Run optional custom commands
        if: ${{ inputs.custom-commands != '' }}
        env:
          CUSTOM_COMMANDS: ${{ inputs.custom-commands }}
        # Runs the shell code from a variable, so that GitHub does not paste it into the script.
        run: eval "$CUSTOM_COMMANDS"
      - name: Build & test
        if: ${{ ! inputs.sonar-enabled }}
        uses: ./workflow-parts/actions/dotnet/build-test
        with:
          dotnet-test-args: ${{ inputs.dotnet-test-args }}
          working-directory: ${{ inputs.working-directory }}
      - name: Build, test & analyze
        if: ${{ inputs.sonar-enabled }}
        uses: ./workflow-parts/actions/dotnet/build-test-sonar
        with:
          dotnet-test-args: ${{ inputs.dotnet-test-args }}
          working-directory: ${{ inputs.working-directory }}
          sonar-cpd-exclusions: ${{ inputs.sonar-cpd-exclusions }}
          sonar-exclusions: ${{ inputs.sonar-exclusions }}
          sonar-host-url: ${{ inputs.sonar-host-url }}
          sonar-organization: ${{ inputs.sonar-organization }}
          sonar-project-key: ${{ inputs.sonar-project-key }}
          sonar-project-name: ${{ inputs.sonar-project-name }}
          sonar-settings-file: ${{ inputs.sonar-settings-file }}
          sonar-token: ${{ secrets.sonar-token }}
      - name: Check license compliance with FOSSA
        # Runs only when the caller enables it, because a run without an API key or without access to FOSSA cannot do this check.
        if: ${{ inputs.fossa-enabled }}
        uses: ./workflow-parts/actions/fossa/analyze
        # https://status.fossa.com/
        continue-on-error: true
        timeout-minutes: 3
        with:
          api-key: "${{ secrets.fossa-api-key }}"
          # Excludes the workflow parts, because they are not part of the code.
          exclude-paths: workflow-parts
          run-tests: ${{ inputs.fossa-test && github.event_name == 'pull_request' }}
          test-diff-revision: ${{ github.event.pull_request.base.sha }}
          report-file: report/fossa.html
          working-directory: ${{ inputs.working-directory }}
      - name: Generate SBOM with Syft
        uses: ./workflow-parts/actions/syft/generate-sbom
        continue-on-error: true
        with:
          exclude-paths: workflow-parts
          target-path: ${{ inputs.working-directory }}
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dotnet-test-results
          # Uploads the report folder, because the build, test and FOSSA actions write their results and reports there.
          path: |
            ${{ inputs.working-directory }}/report/
            ./**/*test-result.xml
            ./**/failure_*.png*
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GITHUB_TOKEN: ${{ github.token }}
