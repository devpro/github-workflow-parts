name: Check changes
description: |
  Checks if the current commit changes one of the given paths.
  Compares with the given base, the base of the pull request, the commit before the push, or the parent commit, in this order.
  Reports a change when the clone does not contain the base, as on a new branch or in a shallow clone, so that no job is skipped by mistake.
  Requires a checkout with the full history (fetch-depth 0).

inputs:
  paths:
    description: Paths to compare, separated by spaces (for example "src test")
    required: true
  base:
    description: >-
      Commit or tree to compare with.
      When empty, uses the base of the pull request, the commit before the push, or the parent commit.
    required: false
    default: ""

outputs:
  changed:
    description: Set to "true" when a path changed, or "false" when no path changed
    value: ${{ steps.compare.outputs.changed }}

runs:
  using: "composite"
  steps:
    - name: Compare with the base
      id: compare
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        PATHS: ${{ inputs.paths }}
      run: |
        read -ra path_list <<< "$PATHS"
        # Compares with the parent commit when the event gives no base, as in a manual or a local run.
        BASE="${BASE:-HEAD~1}"
        if ! git cat-file -e "${BASE}^{tree}" 2>/dev/null; then
          echo "No readable base to compare with, counted as a change"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Comparing ${PATHS} between ${BASE} and HEAD"
        # Saves the exit status, because 1 means a change and a higher value means that git failed.
        status=0
        git diff --quiet "$BASE" HEAD -- "${path_list[@]}" || status=$?
        case "$status" in
          0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
          1)
            git diff --name-status "$BASE" HEAD -- "${path_list[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
        esac
