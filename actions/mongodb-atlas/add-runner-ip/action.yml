name: Add GitHub Actions runner public IP to MongoDB Atlas
description: Adds the IP address of the runner to the project access list for a limited time

inputs:
  atlas-publickey:
    description: MongoDB public key
    required: true
  atlas-privatekey:
    description: MongoDB private key
    required: true
  atlas-groupid:
    description: MongoDB group ID
    required: true

runs:
  using: "composite"
  steps:
    - name: Add runner IP to MongoDB Atlas
      shell: bash
      env:
        ATLAS_GROUP_ID: ${{ inputs.atlas-groupid }}
        ATLAS_PRIVATE_KEY: ${{ inputs.atlas-privatekey }}
        ATLAS_PUBLIC_KEY: ${{ inputs.atlas-publickey }}
      run: |
        # Gets the current outbound IP address of the runner.
        RUNNER_IP=$(curl -fsS https://api.ipify.org || curl -fsS https://ifconfig.me)
        if [ -z "$RUNNER_IP" ]; then
          echo "Failed to detect runner IP"
          exit 1
        fi

        echo "Detected runner IP: $RUNNER_IP"

        # Prepares the JSON payload: one /32 entry that Atlas deletes after 1 hour.
        # Uses an ISO 8601 UTC date for deleteAfterDate.
        DELETE_AFTER=$(date -u -d '+3600 seconds' +"%Y-%m-%dT%H:%M:%SZ")
        PAYLOAD="[{\"ipAddress\": \"$RUNNER_IP\", \"comment\": \"GH Actions temp - run ${{ github.run_id }}\", \"deleteAfterDate\": \"$DELETE_AFTER\"}]"

        # Calls the Atlas API v2 to add the entry, with digest authentication.
        RESPONSE=$(curl -s -w "%{http_code}" --user "${ATLAS_PUBLIC_KEY}:${ATLAS_PRIVATE_KEY}" --digest \
          -H "Accept: application/vnd.atlas.2023-01-01+json" \
          -H "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_GROUP_ID}/accessList")

        HTTP_CODE=${RESPONSE: -3}

        if [[ "$HTTP_CODE" != "201" ]]; then
          echo "Failed to add IP to Atlas access list (code $HTTP_CODE)"
          exit 1
        fi

        echo "Successfully added temporary IP $RUNNER_IP to Atlas access list (auto-deletes ~1h)"
