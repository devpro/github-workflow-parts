name: Lint Go code
description: |
  Checks a Go module with the Go toolchain alone, no third party linter: its files formatted by gofmt,
  its go.mod and go.sum tidy, and go vet finding nothing.
  Needs Go 1.23 or later on the path, from actions/setup-go or the image of the job.

inputs:
  working-directory:
    description: Directory of the Go module (go.mod), relative to the workspace, which a composite action does not take from the defaults of the calling job
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Check formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "ERROR: Files not formatted by gofmt, which gofmt -w fixes:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    # A requirement nothing imports, or one missing, shows here rather than as a surprise in the next build.
    - name: Check go.mod and go.sum are tidy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod tidy -diff
    - name: Vet
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go vet ./...
