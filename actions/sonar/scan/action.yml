name: Analyze with Sonar
description: |
  Installs the Sonar scanner CLI and its Java runtime from the official archive, and verifies the SHA256 checksum.
  Analyzes code other than .NET, mainly JavaScript and TypeScript, with the coverage of the lcov reports.
  Replaces SonarSource/sonarqube-scan-action, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  scanner-version:
    description: Version of the Sonar scanner CLI (check latest from https://github.com/SonarSource/sonar-scanner-cli/releases)
    required: false
    default: "8.5.0.16571"
  scanner-sha256:
    description: SHA256 of the scanner archive for x64, required when scanner-version changes
    required: false
    default: "62a200079f5ed38682e59ce5fb507f75b7a3c8dd672cfaf647be15a2406422cd"  # 8.5.0.16571
  scanner-sha256-arm64:
    description: SHA256 of the scanner archive for arm64, required when scanner-version changes
    required: false
    default: "7f6e2d95375765edcf02f370185f5d5976da55b3f8f3ef594d46f207abefb9d8"  # 8.5.0.16571
  coverage-paths:
    description: >-
      lcov coverage reports, relative to the working directory, separated by commas.
      Uses coverage/lcov.info when empty and the project has no sonar-project.properties.
    required: false
    default: ""
  cpd-exclusions:
    description: Files or directories to exclude from the Sonar code duplication analysis
    required: false
    default: ""
  exclusions:
    description: >-
      Files or directories to exclude from the Sonar analysis.
      Uses **/node_modules/** when empty and the project has no sonar-project.properties.
    required: false
    default: ""
  host-url:
    description: Sonar host URL
    required: true
  organization:
    description: Sonar organization, required by SonarCloud and not used by a SonarQube server
    required: false
    default: ""
  project-key:
    description: Sonar project key, required when the project has no sonar-project.properties
    required: false
    default: ""
  project-name:
    description: Sonar project name
    required: false
    default: ""
  token:
    description: Sonar token for login
    required: true
  working-directory:
    description: >-
      Directory of the project to analyze, relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install Sonar scanner
      shell: bash
      env:
        SCANNER_VERSION: ${{ inputs.scanner-version }}
        SCANNER_PLATFORM: linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
        SCANNER_SHA256: ${{ runner.arch == 'ARM64' && inputs.scanner-sha256-arm64 || inputs.scanner-sha256 }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the archive.
        cd "$(mktemp -d)"
        archive="sonar-scanner-cli-${SCANNER_VERSION}-${SCANNER_PLATFORM}.zip"
        curl -fsSL -O "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${archive}"
        echo "${SCANNER_SHA256}  ${archive}" | sha256sum --check --status
        if command -v unzip > /dev/null; then
          unzip -q "$archive"
        else
          # Uses Python when unzip is not available, as in the golang image.
          # Restores the file modes and the links of the included JRE, because the zipfile module does not keep them.
          python3 - "$archive" <<'PYTHON'
        import os, stat, sys, zipfile
        with zipfile.ZipFile(sys.argv[1]) as archive:
            for entry in archive.infolist():
                path = archive.extract(entry)
                mode = entry.external_attr >> 16
                if stat.S_ISLNK(mode):
                    target = archive.read(entry).decode()
                    os.remove(path)
                    os.symlink(target, path)
                elif mode:
                    os.chmod(path, stat.S_IMODE(mode))
        PYTHON
        fi
        # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
        rm -rf "${RUNNER_TEMP}/sonar-scanner"
        mv "sonar-scanner-${SCANNER_VERSION}-${SCANNER_PLATFORM}" "${RUNNER_TEMP}/sonar-scanner"
        rm -f "$archive"
        echo "${RUNNER_TEMP}/sonar-scanner/bin" >> "$GITHUB_PATH"
    # Caches the analyzers, because Sonar downloads them to its user home.
    - name: Cache Sonar packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    # Uses sonar-project.properties as the configuration, and replaces a value only when the input is given.
    - name: Analyze the code
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COVERAGE_PATHS: ${{ inputs.coverage-paths }}
        SONAR_CPD_EXCLUSIONS: ${{ inputs.cpd-exclusions }}
        SONAR_EXCLUSIONS: ${{ inputs.exclusions }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
        SONAR_ORGANIZATION: ${{ inputs.organization }}
        SONAR_PROJECT_KEY: ${{ inputs.project-key }}
        SONAR_PROJECT_NAME: ${{ inputs.project-name }}
        SONAR_TOKEN: ${{ inputs.token }}
      run: |
        if [ ! -f sonar-project.properties ]; then
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "ERROR: No project-key, and no sonar-project.properties to read it from" >&2
            exit 1
          fi
          COVERAGE_PATHS="${COVERAGE_PATHS:-coverage/lcov.info}"
          SONAR_EXCLUSIONS="${SONAR_EXCLUSIONS:-**/node_modules/**}"
        fi
        # Lets the scanner read the token from SONAR_TOKEN, because all processes can see the command line.
        args=(-Dsonar.host.url="$SONAR_HOST_URL")
        add() {
          if [ -n "$2" ]; then
            args+=("-D$1=$2")
          fi
        }
        add sonar.cpd.exclusions "$SONAR_CPD_EXCLUSIONS"
        add sonar.exclusions "$SONAR_EXCLUSIONS"
        add sonar.javascript.lcov.reportPaths "$COVERAGE_PATHS"
        add sonar.organization "$SONAR_ORGANIZATION"
        add sonar.projectKey "$SONAR_PROJECT_KEY"
        add sonar.projectName "$SONAR_PROJECT_NAME"
        sonar-scanner "${args[@]}"
