name: Build and push a container image
description: |
  Builds a container image for one or more platforms with the BuildKit of the Docker daemon, and pushes it.
  With several platforms, pushes each platform with its own tag first, then creates the common tag.
  The job must log in to the registry before this action.
  When push is false, only builds the image and keeps it in the daemon, so that a pipeline can test the build.
  Linux runners (for example ubuntu-latest or ubuntu-24.04-arm) build Linux platforms.
  Windows runners (for example windows-2025) build only windows/amd64, for their own Windows version.

inputs:
  image-definition:
    description: Path to the container definition file (Dockerfile, Containerfile), relative to the working directory
    required: true
  image-repository:
    description: Repository of the image, with its registry (for example docker.io/devprofr/app)
    required: true
  image-tag:
    description: >-
      Tag to push.
      When there are several platforms, each platform also gets this tag with its name at the end (for example 1.0.1-linux-arm64).
    required: true
  platforms:
    description: >-
      Comma-separated platforms to build, or only windows/amd64 on a Windows runner.
      Requires the Setup QEMU action before a build for a platform that is different from the runner.
    required: false
    default: "linux/amd64"
  build-arguments:
    description: Build arguments, one KEY=value per line
    required: false
    default: ""
  push:
    description: >-
      Push the image.
      When false, only build the image and keep it in the daemon, with no digest output.
    required: false
    default: "true"
  working-directory:
    description: >-
      Directory where the build runs, relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

outputs:
  digest:
    description: >-
      Digest of the pushed image, or of the manifest list when there are several platforms.
      Empty when the image is not pushed.
    value: ${{ steps.build.outputs.digest || steps.build-windows.outputs.digest }}

runs:
  using: "composite"
  steps:
    # Uses the Docker CLI of the runner, so that no third-party action is necessary.
    # Uses the default builder of the daemon, because a separate builder pulls a BuildKit image and leaves data for later jobs.
    # Gives each platform a tag, because this builder cannot push by digest only.
    # With the classic image store, this builder also builds only one platform at a time.
    - name: Build and push container image
      id: build
      if: ${{ inputs.platforms != 'windows/amd64' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IMAGE_DEFINITION: ${{ inputs.image-definition }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_ARGUMENTS: ${{ inputs.build-arguments }}
        PUSH: ${{ inputs.push }}
      run: |
        build_args=()
        while IFS= read -r argument; do
          [ -n "$argument" ] && build_args+=(--build-arg "$argument")
        done <<< "$BUILD_ARGUMENTS"

        # Builds one platform, pushes it with a tag and prints the digest of the pushed image.
        build_push() {
          local platform="$1" ref="$2" metadata digest
          if [[ "$PUSH" != true ]]; then
            docker buildx build --builder default --file "$IMAGE_DEFINITION" --platform "$platform" \
              --tag "$ref" "${build_args[@]}" . >&2
            return 0
          fi
          metadata="$(mktemp)"
          docker buildx build --builder default --file "$IMAGE_DEFINITION" --platform "$platform" \
            --tag "$ref" --push --metadata-file "$metadata" "${build_args[@]}" . >&2
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          # Removes the local image, because the registry now has it.
          docker image rm "$ref" >/dev/null 2>&1 || true
          if [[ "$digest" != sha256:* ]]; then
            echo "ERROR: The build reported no digest for ${ref}" >&2
            return 1
          fi
          echo "$digest"
        }

        IFS=',' read -ra platform_list <<< "$PLATFORMS"
        if [[ "$PUSH" != true ]]; then
          for platform in "${platform_list[@]}"; do
            ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            [ "${#platform_list[@]}" -gt 1 ] && ref="${ref}-${platform//\//-}"
            build_push "$platform" "$ref"
            echo "Built ${ref}, not pushed"
          done
          exit 0
        fi
        if [ "${#platform_list[@]}" -eq 1 ]; then
          digest="$(build_push "${platform_list[0]}" "${IMAGE_REPOSITORY}:${IMAGE_TAG}")"
        else
          sources=()
          for platform in "${platform_list[@]}"; do
            platform_digest="$(build_push "$platform" "${IMAGE_REPOSITORY}:${IMAGE_TAG}-${platform//\//-}")"
            sources+=("${IMAGE_REPOSITORY}@${platform_digest}")
          done
          # Creates the tag after all platforms are pushed, so that the tag never points to an incomplete image.
          docker buildx imagetools create --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
        fi
        echo "Pushed ${IMAGE_REPOSITORY}:${IMAGE_TAG}@${digest}"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    # Uses the classic builder, because the Windows engine has no BuildKit.
    # This builder can build only for the platform of the engine.
    - name: Build and push Windows container image
      id: build-windows
      if: ${{ inputs.platforms == 'windows/amd64' }}
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        DOCKER_BUILDKIT: "0"
        IMAGE_DEFINITION: ${{ inputs.image-definition }}
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        BUILD_ARGUMENTS: ${{ inputs.build-arguments }}
        PUSH: ${{ inputs.push }}
      run: |
        $ref = "${env:IMAGE_REPOSITORY}:${env:IMAGE_TAG}"
        $buildArgs = @('build', '--file', $env:IMAGE_DEFINITION, '--tag', $ref)
        foreach ($argument in ($env:BUILD_ARGUMENTS -split "`r?`n")) {
          if ($argument) { $buildArgs += @('--build-arg', $argument) }
        }
        & docker @buildArgs .
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ($env:PUSH -ne 'true') {
          Write-Output "Built $ref, not pushed"
          exit 0
        }
        docker push $ref
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Takes the first digest without a check of the repository name, because Docker Hub names do not include the registry.
        # An image built in this job has only the digest of its push.
        $repoDigest = docker image inspect $ref --format '{{range .RepoDigests}}{{println .}}{{end}}' |
          Where-Object { $_ } | Select-Object -First 1
        # Removes the local image, because the registry now has it.
        docker image rm $ref *> $null
        $digest = ($repoDigest -split '@')[-1]
        if ($digest -notlike 'sha256:*') {
          Write-Error "The push reported no digest for $ref"
          exit 1
        }
        Write-Output "Pushed ${ref}@${digest}"
        "digest=$digest" >> $env:GITHUB_OUTPUT
        exit 0
