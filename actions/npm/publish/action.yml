name: Publish an npm package
description: |
  Publishes the package in the working directory.
  Skips a version that is already in the registry, so that a push without a new version does not fail.
  Uses the registry and the credentials of the .npmrc that actions/setup-node writes with registry-url.
  The credentials are a token in NODE_AUTH_TOKEN, or the OIDC token of npm trusted publishing (permission id-token write).
  Without credentials, as in a local run, adds --dry-run to the command if the registry refuses access, to check the package without a publication.

inputs:
  publish-command:
    description: Command to publish the package (for example "pnpm publish --no-git-checks" for a pnpm workspace)
    required: false
    default: "npm publish"
  working-directory:
    description: Directory that contains the package.json of the package
    required: false
    default: "."

outputs:
  published:
    description: Set to "true" when the action published the package, or "false" when the version was already published
    value: ${{ steps.registry.outputs.exists == 'false' && 'true' || 'false' }}
  version:
    description: Version of the package, read from its package.json
    value: ${{ steps.registry.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Check whether the version is already published
      id: registry
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        name=$(node -p "require('./package.json').name")
        version=$(node -p "require('./package.json').version")
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        # Continues on E404, because npm gives this error when the registry does not have the package or the version.
        # All other errors mean that npm could not read the registry.
        errors=$(mktemp)
        if npm view "${name}@${version}" version > /dev/null 2> "$errors"; then
          echo "${name}@${version} is already published, nothing to do"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        elif grep -q E404 "$errors"; then
          echo "${name}@${version} is not published yet"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        elif grep -qE 'E401|ENEEDAUTH' "$errors" && [[ -z "${NODE_AUTH_TOKEN:-}" && -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "No credential for the registry, so ${name}@${version} is packed and checked with --dry-run instead"
          echo "exists=dry-run" >> "$GITHUB_OUTPUT"
        else
          cat "$errors" >&2
          exit 1
        fi
    - name: Publish the package
      if: steps.registry.outputs.exists == 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUBLISH_COMMAND: ${{ inputs.publish-command }}
      # Runs the shell code from a variable, so that GitHub does not paste it into the script.
      run: eval "$PUBLISH_COMMAND"
    - name: Check the package without publishing it
      if: steps.registry.outputs.exists == 'dry-run'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PUBLISH_COMMAND: ${{ inputs.publish-command }}
      run: eval "$PUBLISH_COMMAND --dry-run"
