name: Reusable - Terraform apply

on:
  workflow_call:
    inputs:
      job-name:
        description: "Job name"
        type: string
        required: false
        default: "Deploy"
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 60
      working-directory:
        description: "Working directory"
        type: string
        required: false
        default: "."
      operating-system:
        description: "Operating system executing the runner"
        type: string
        required: false
        default: "ubuntu-latest"
      destroy:
        description: "Destroy the resources of the environment rather than apply the configuration"
        type: boolean
        required: false
        default: false
      environment:
        description: "GitHub environment"
        type: string
        required: true
      tfbackend-project:
        description: "Terraform backend project"
        type: string
        required: true
      custom-commands:
        description: "Optional shell commands to run before apply"
        type: string
        required: false
        default: ""
      terraform-var-flags:
        description: 'Extra -var "key=value" flags (space separated)'
        type: string
        required: false
        default: ""
      workflow-parts-version:
        description: "GitHub workflow parts version (branch/tag/SHA). Should match the ref/tag/SHA the caller pinned for this reusable workflow itself. Ignored when the caller is this repository, whose checkout already holds the actions under test."
        type: string
        required: false
        default: "main"
    secrets:
      atlas-publickey:
        description: "Atlas public key"
        required: true
      atlas-privatekey:
        description: "Atlas private key"
        required: true
      atlas-groupid:
        description: "Atlas group ID"
        required: true
      tfbackend-connstring:
        description: "Terraform backend connection string"
        required: true
      tfbackend-dbname:
        description: "Terraform backend database name"
        required: true
      tfbackend-tenant:
        description: "Terraform backend tenant"
        required: true
      tfbackend-username:
        description: "Terraform backend user name"
        required: true
      tfbackend-userpwd:
        description: "Terraform backend user password"
        required: true
      additional-vars:
        description: "Additional variables"
        required: false

jobs:
  terraform-apply:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      tfbackend:
        image: devprofr/terraform-backend-mongodb:latest
        env:
          Application__IsHttpsRedirectionEnabled: false
          ConnectionStrings__MongoDb: ${{ secrets.tfbackend-connstring }}
          MongoDb__ConnectionStringName: MongoDb
          MongoDb__DatabaseName: ${{ secrets.tfbackend-dbname }}
        ports:
          - 8080:8080
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # The caller being this repository, the actions under test are those of the commit under test.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
      - name: Add runner ID to MongoDB Atlas
        uses: ./workflow-parts/actions/mongodb-atlas/add-runner-ip
        with:
          atlas-publickey: ${{ secrets.atlas-publickey }}
          atlas-privatekey: ${{ secrets.atlas-privatekey }}
          atlas-groupid: ${{ secrets.atlas-groupid }}
      - name: Set additional variables
        env:
          ADDITIONAL_VARS: ${{ secrets.additional-vars }}
        run: |
          if [[ -n "$ADDITIONAL_VARS" ]]; then
            echo "$ADDITIONAL_VARS" | while IFS='=' read -r _ val; do
              if [[ -n "$val" ]]; then
                echo "::add-mask::$val"
              fi
            done
            echo "$ADDITIONAL_VARS" >> "$GITHUB_ENV"
          fi
      - name: Run optional custom commands
        if: ${{ inputs.custom-commands != '' }}
        run: |
          ${{ inputs.custom-commands }}
      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: Install terraform
        uses: ./workflow-parts/actions/terraform/setup
      - name: Terraform init
        run: terraform init
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -input=false -out=plan.tfplan ${{ inputs.terraform-var-flags }}
        env:
          # Read by Terraform as arguments of the plan command, the plan of a destruction being applied as any other.
          TF_CLI_ARGS_plan: ${{ inputs.destroy && '-destroy' || '' }}
      - name: Terraform apply
        run: terraform apply -auto-approve plan.tfplan
    env:
      TF_HTTP_ADDRESS: "http://localhost:8080/${{ secrets.tfbackend-tenant }}/state/${{ inputs.tfbackend-project }}"
      TF_HTTP_LOCK_ADDRESS: "http://localhost:8080/${{ secrets.tfbackend-tenant }}/state/${{ inputs.tfbackend-project }}/lock"
      TF_HTTP_UNLOCK_ADDRESS: "http://localhost:8080/${{ secrets.tfbackend-tenant }}/state/${{ inputs.tfbackend-project }}/lock"
      TF_HTTP_USERNAME: "${{ secrets.tfbackend-username }}"
      TF_HTTP_PASSWORD: "${{ secrets.tfbackend-userpwd }}"
