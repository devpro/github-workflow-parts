name: Start MongoDB
description: |
  Starts a local MongoDB server on 127.0.0.1, with mongosh on the path.
  Uses the official archives and verifies their SHA256 checksums, because apt packages need root access or sudo.
  Linux x64 or arm64 runners on Ubuntu 24.04 only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  mongodb-version:
    description: >-
      Version of the MongoDB server (check latest from https://www.mongodb.com/try/download/community).
      Uses 9.0.8 when empty.
    required: false
    default: ""
  mongosh-version:
    description: Version of mongosh (check latest from https://github.com/mongodb-js/mongosh/releases)
    required: false
    default: "2.14.3"
  mongosh-sha256:
    description: >-
      SHA256 of the mongosh archive for x64.
      Required when mongosh-version changes, because the release contains no checksum file.
    required: false
    default: "2f9082b19c3daa4469865cb2d13ba64eea9f5b447371ecd25f175bb99320d575"  # 2.14.3
  mongosh-sha256-arm64:
    description: SHA256 of the mongosh archive for arm64, required when mongosh-version changes
    required: false
    default: "47ce1c6b6aa22c58118416f6423237093bf67886b56998fae4dd8430b369b667"  # 2.14.3
  port:
    description: Port of the server
    required: false
    default: "27017"
  replica-set:
    description: >-
      Name of the single-node replica set.
      Set it for an application that uses transactions, because a standalone server does not support them.
      Starts a standalone server when empty.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install & start MongoDB
      shell: bash
      env:
        # Sets the default version only here, because the workflows that call this action pass an empty input.
        MONGODB_ARCHIVE: mongodb-linux-${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}-ubuntu2404-${{ inputs.mongodb-version || '9.0.8' }}.tgz
        MONGOSH_VERSION: ${{ inputs.mongosh-version }}
        MONGOSH_ARCHIVE: mongosh-${{ inputs.mongosh-version }}-linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}.tgz
        MONGOSH_SHA256: ${{ runner.arch == 'ARM64' && inputs.mongosh-sha256-arm64 || inputs.mongosh-sha256 }}
        MONGODB_PORT: ${{ inputs.port }}
        REPLICA_SET: ${{ inputs.replica-set }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of an archive.
        cd "$(mktemp -d)"

        echo "Downloading MongoDB server and mongosh..."
        curl -fsSL -O "https://fastdl.mongodb.org/linux/${MONGODB_ARCHIVE}"
        curl -fsSL -O "https://fastdl.mongodb.org/linux/${MONGODB_ARCHIVE}.sha256"
        curl -fsSL -O "https://github.com/mongodb-js/mongosh/releases/download/v${MONGOSH_VERSION}/${MONGOSH_ARCHIVE}"

        echo "Verifying checksums..."
        sha256sum --check --status "${MONGODB_ARCHIVE}.sha256"
        echo "${MONGOSH_SHA256}  ${MONGOSH_ARCHIVE}" | sha256sum --check --status

        # Installs in a directory that the job owns, so that the job needs no root access and no sudo.
        mkdir -p "${RUNNER_TEMP}/bin" "${RUNNER_TEMP}/mongodb/data"
        tar xzf "${MONGODB_ARCHIVE}" --strip-components=2 -C "${RUNNER_TEMP}/bin" --wildcards "*/bin/mongod"
        tar xzf "${MONGOSH_ARCHIVE}" --strip-components=2 -C "${RUNNER_TEMP}/bin" --wildcards "*/bin/mongosh"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        export PATH="${RUNNER_TEMP}/bin:$PATH"
        rm -f "${MONGODB_ARCHIVE}" "${MONGODB_ARCHIVE}.sha256" "${MONGOSH_ARCHIVE}"

        # Starts the server with --fork, because a container has no systemd.
        log="${RUNNER_TEMP}/mongodb/mongod.log"
        args=(--dbpath "${RUNNER_TEMP}/mongodb/data" --bind_ip 127.0.0.1 --port "$MONGODB_PORT" --fork --logpath "$log")
        check='db.runCommand({ ping: 1 })'
        if [[ -n "$REPLICA_SET" ]]; then
          args+=(--replSet "$REPLICA_SET")
          # Initiates the replica set on the first check that the server answers, then waits for the node to become primary.
          check="try { rs.status() } catch (e) { rs.initiate({ _id: '${REPLICA_SET}', members: [{ _id: 0, host: '127.0.0.1:${MONGODB_PORT}' }] }) }"
          check+=" quit(db.hello().isWritablePrimary ? 0 : 1)"
        fi
        # Increases the soft limit of open files, because the server keeps one file open for each collection and each index.
        # Containers often have a limit of 1024, and the server then stops with "Too many open files".
        # MongoDB recommends 64000 in its production notes, but the soft limit cannot exceed the hard limit.
        soft="$(ulimit -Sn)"
        if [[ "$soft" != unlimited ]] && (( soft < 64000 )); then
          hard="$(ulimit -Hn)"
          if [[ "$hard" == unlimited ]] || (( hard > 64000 )); then
            hard=64000
          fi
          ulimit -Sn "$hard"
        fi
        # Prints the log when the server does not start, because only the log gives the cause and the runner does not keep it.
        if ! mongod "${args[@]}"; then
          cat "$log"
          exit 1
        fi
        for _ in $(seq 1 30); do
          if mongosh --host "127.0.0.1:${MONGODB_PORT}" --quiet --eval "$check" >/dev/null 2>&1; then
            mongod --version | head -1
            exit 0
          fi
          echo "MongoDB not ready yet, retrying in 1 second..."
          sleep 1
        done
        echo "::error::MongoDB was not ready within 30 seconds"
        cat "$log"
        exit 1
