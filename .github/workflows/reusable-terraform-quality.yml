name: Reusable - Terraform validate

on:
  workflow_call:
    inputs:
      job-name:
        description: "Job name"
        type: string
        required: false
        default: "Validate"
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 30
      working-directory:
        description: "Folder searched for Terraform configurations, where a directory under a modules folder is a module and any other one a root configuration"
        type: string
        required: false
        default: "."
      operating-system:
        description: "Operating system executing the runner"
        type: string
        required: false
        default: "ubuntu-latest"
      severity:
        description: "Comma-separated severities the Trivy scans of the code and of the providers report"
        type: string
        required: false
        default: "HIGH,CRITICAL"
      workflow-parts-version:
        description: "GitHub workflow parts version (branch/tag/SHA). Should match the ref/tag/SHA the caller pinned for this reusable workflow itself. Ignored when the caller is this repository, whose checkout already holds the actions under test."
        type: string
        required: false
        default: "main"

jobs:
  terraform-validate:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # The caller being this repository, the actions under test are those of the commit under test.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      # Tracked files only, which leaves out the checkout of the workflow parts, the .terraform folders and what the repository ignores.
      # A directory under a modules folder is a module, any other one a root configuration: a project, an example or a sample.
      - name: Find Terraform configurations
        run: |
          list="${RUNNER_TEMP}/terraform-configurations.tsv"
          git ls-files -z -- '*.tf' | xargs -0 -r -n 1 dirname | sort -u | while IFS= read -r dir; do
            if [[ "/${dir}/" == */modules/* ]]; then
              printf 'module\t%s\n' "$dir"
            else
              printf 'project\t%s\n' "$dir"
            fi
          done > "$list"
          if [ ! -s "$list" ]; then
            echo "::error::No tracked Terraform file under ${INPUT_WORKING_DIRECTORY}"
            exit 1
          fi
          cat "$list"
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      - name: Install terraform
        uses: ./workflow-parts/actions/terraform/setup
      # Each check runs whatever the one before it found, so a single run reports them all.
      - name: Check Terraform format
        if: success() || failure()
        run: |
          failed=()
          while IFS=$'\t' read -r _ dir; do
            terraform fmt -check -diff "$dir" || failed+=("$dir")
          done < "${RUNNER_TEMP}/terraform-configurations.tsv"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::terraform fmt found unformatted files in %s\n' "${failed[@]}"
            exit 1
          fi
      # A root configuration is applied with its dependency lock file, so the lock file is committed and must match its constraints.
      # A module is called by others, whose lock file wins, so a lock file of its own is never used.
      - name: Validate Terraform configurations
        if: success() || failure()
        run: |
          # Every configuration shares one download of each provider.
          # The folder is not kept between runs, so the provider scan sees exactly the providers of this run.
          export TF_PLUGIN_CACHE_DIR="${RUNNER_TEMP}/terraform-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          failed=()
          while IFS=$'\t' read -r kind dir; do
            echo "::group::${kind} ${dir}"
            init_args=(-backend=false -input=false)
            lock_file_tracked=false
            if git ls-files --error-unmatch -- "${dir}/.terraform.lock.hcl" > /dev/null 2>&1; then
              lock_file_tracked=true
            fi
            if [ "$kind" = project ]; then
              if [ "$lock_file_tracked" = true ]; then
                init_args+=(-lockfile=readonly)
              else
                echo "::warning::Root configuration ${dir} has no committed .terraform.lock.hcl"
              fi
            elif [ "$lock_file_tracked" = true ]; then
              echo "::warning::Module ${dir} commits a .terraform.lock.hcl its callers never use"
            fi
            if ! { terraform -chdir="$dir" init "${init_args[@]}" && terraform -chdir="$dir" validate; }; then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/terraform-configurations.tsv"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::terraform validate failed in %s\n' "${failed[@]}"
            exit 1
          fi
      # Read from the lock file of every configuration, written by validate where none is committed, so a module pinning an old version shows too.
      # A newer major version is a warning, as its upgrade changes the code; a newer minor or patch version is a notice.
      - name: Check provider versions
        if: success() || failure()
        run: |
          providers="${RUNNER_TEMP}/terraform-providers.tsv"
          while IFS=$'\t' read -r _ dir; do
            if [ -f "${dir}/.terraform.lock.hcl" ]; then
              awk -v dir="$dir" -F '"' '/^provider "/ { source = $2 } /^  version *=/ { print source "\t" $2 "\t" dir }' "${dir}/.terraform.lock.hcl"
            fi
          done < "${RUNNER_TEMP}/terraform-configurations.tsv" | sort -u > "$providers"
          declare -A latest
          while IFS=$'\t' read -r source version dirs; do
            host="${source%%/*}"
            address="${source#*/}"
            if [ "$host" != registry.terraform.io ]; then
              echo "::notice::${source} ${version} is not checked, as only registry.terraform.io is queried"
              continue
            fi
            if [ -z "${latest[$address]+set}" ]; then
              # Stable releases only, as the latest version the registry gives may be a prerelease.
              latest[$address]="$(curl -fsSL --retry 3 "https://registry.terraform.io/v1/providers/${address}/versions" \
                | jq -r '[.versions[].version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty' || true)"
            fi
            newest="${latest[$address]}"
            if [ -z "$newest" ]; then
              echo "::notice::No stable release of ${address} found on the registry"
            elif [ "$version" != "$newest" ] && [ "$(printf '%s\n' "$version" "$newest" | sort -V | tail -n 1)" = "$newest" ]; then
              if [ "${version%%.*}" -lt "${newest%%.*}" ]; then
                echo "::warning title=Outdated provider::${address} ${version} is a major version behind ${newest}, in ${dirs}"
              else
                echo "::notice title=Outdated provider::${address} ${version} is behind ${newest}, in ${dirs}"
              fi
            fi
          done < <(awk -F '\t' '{ key = $1 "\t" $2; if (key in dirs) dirs[key] = dirs[key] ", " $3; else dirs[key] = $3 } END { for (key in dirs) print key "\t" dirs[key] }' "$providers" | sort)
      # A provider is a Go binary run with the credentials of the deployment, so the vulnerabilities of its Go version and modules count.
      - name: Scan providers with Trivy
        if: success() || failure()
        uses: ./workflow-parts/actions/trivy/scan
        with:
          scan-type: rootfs
          target: ${{ runner.temp }}/terraform-plugin-cache
          format: json
          output-file: ${{ runner.temp }}/terraform-providers-trivy.json
          severity: ${{ inputs.severity }}
      # Reported as warnings, as fixing them means upgrading a provider, often to a new major version.
      - name: Report provider vulnerabilities
        if: success() || failure()
        run: |
          report="${RUNNER_TEMP}/terraform-providers-trivy.json"
          if [ ! -f "$report" ]; then
            echo "::warning::No provider scan report, see the Trivy step"
            exit 0
          fi
          jq -r '
            .Results[]? | select((.Vulnerabilities // []) | length > 0)
            | (.Target | split("/")) as $path
            | (.Vulnerabilities | map(.Severity)) as $severities
            | (.Vulnerabilities | map(select(.Severity == "CRITICAL") | .VulnerabilityID) | unique) as $critical
            | [($path[1:3] | join("/")), $path[3],
               ($severities | map(select(. == "CRITICAL")) | length), ($severities | map(select(. == "HIGH")) | length), ($severities | length),
               ($critical + (.Vulnerabilities | map(.VulnerabilityID) | unique - $critical) | .[0:5] | join(", "))]
            | @tsv' "$report" | sort > "${RUNNER_TEMP}/terraform-providers-vulnerabilities.tsv"
          if [ ! -s "${RUNNER_TEMP}/terraform-providers-vulnerabilities.tsv" ]; then
            echo "No ${SEVERITY} vulnerability in the providers"
            exit 0
          fi
          {
            echo "### Provider vulnerabilities (${SEVERITY})"
            echo
            echo "| Provider | Version | Critical | High | Among them |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r address version critical high total ids; do
            echo "::warning title=Vulnerable provider::${address} ${version} has ${total} vulnerabilities, ${critical} critical and ${high} high (${ids})"
            echo "| ${address} | ${version} | ${critical} | ${high} | ${ids} |" >> "$GITHUB_STEP_SUMMARY"
          done < "${RUNNER_TEMP}/terraform-providers-vulnerabilities.tsv"
        env:
          SEVERITY: ${{ inputs.severity }}
      # Checkov is a static code analysis tool for infrastructure as code (IaC) and also a software composition analysis (SCA) tool for images and open source packages
      - name: Run Checkov
        if: success() || failure()
        run: |
          pipx run --spec checkov==3.3.30 checkov -d . \
            --skip-path workflow-parts \
            --soft-fail \
            --output cli --output sarif \
            --output-file-path console,results.sarif
        continue-on-error: true
      # needs GitHub code security > code scanning, not available on private repos
      # - name: Upload SARIF file
      #   uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
      #   if: success() || failure()
      #   with:
      #     sarif_file: results.sarif
      # TFLint is a pluggable terraform linter (ref. https://github.com/terraform-linters/tflint)
      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('**/.tflint.hcl') }}
      - name: Setup TFLint
        uses: ./workflow-parts/actions/tflint/setup
        with:
          # ref. https://github.com/terraform-linters/tflint/releases
          tflint-version: v0.65.0
      # Each configuration is linted from inside it, with its own .tflint.hcl.
      - name: Run TFLint
        if: success() || failure()
        run: |
          failed=()
          while IFS=$'\t' read -r _ dir; do
            echo "::group::${dir}"
            if ! { tflint --chdir="$dir" --init && tflint --chdir="$dir" --format compact; }; then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/terraform-configurations.tsv"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::TFLint failed in %s\n' "${failed[@]}"
            exit 1
          fi
        env:
          # ref. https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
      # An action step ignores the default working directory, hence the explicit target.
      - name: Run Trivy IaC scan
        if: success() || failure()
        uses: ./workflow-parts/actions/trivy/scan
        with:
          scan-type: config
          target: ${{ inputs.working-directory }}
          skip-dirs: workflow-parts
          format: sarif
          output-file: trivy-results.sarif
          severity: ${{ inputs.severity }}
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: security-results
          path: |
            ${{ inputs.working-directory }}/results.sarif
            trivy-results.sarif
            ${{ runner.temp }}/terraform-providers-trivy.json
          retention-days: 14
    env:
      TF_IN_AUTOMATION: true
