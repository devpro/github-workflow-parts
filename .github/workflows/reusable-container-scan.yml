name: Reusable - Container scan

on:
  workflow_call:
    inputs:
      base-image-argument:
        description: Build argument that gives the base image to the image definition
        type: string
        required: false
        default: BASE_IMAGE
      base-image-definition:
        description: >-
          Path to the definition of the base image.
          Builds the base image first, so that the scan uses the base of this commit and not a published base.
        type: string
        required: false
        default: ""
      image-definition:
        description: Path to the container definition file (Dockerfile, Containerfile)
        type: string
        required: true
      image-name:
        description: Image name
        type: string
        required: true
      image-path:
        description: Image path
        type: string
        required: true
      image-tag:
        description: Image tag
        type: string
        required: true
      job-name:
        description: Job name
        type: string
        required: false
        default: Scan
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 30
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      severity:
        description: Severities that fail the scan when the vulnerability has a fix (for example "CRITICAL,HIGH,MEDIUM" to include MEDIUM)
        type: string
        required: false
        default: CRITICAL,HIGH
      trivy-ignore-file:
        description: >-
          Trivy ignore file, relative to the root of the repository.
          Lists the vulnerabilities to ignore, each with a reason and an expiry date (expired_at).
          The default file is optional.
        type: string
        required: false
        default: .trivyignore.yaml
      workflow-parts-version:
        description: >-
          GitHub workflow parts version (branch/tag/SHA).
          Use the same version as the one that calls this reusable workflow.
          Ignored when this repository is the caller, because it tests the actions of the current commit.
        type: string
        required: false
        default: "main"
      working-directory:
        description: Working directory
        type: string
        required: false
        default: "."

jobs:
  container-scan:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      # Builds without cache, so that the scan checks the result of a clean build.
      # A runner that keeps its Docker data can have an old base image or an old `apt-get upgrade` layer.
      # These can contain package versions that already have a fix.
      - name: Build base container image
        if: ${{ inputs.base-image-definition != '' }}
        run: docker build . --pull --no-cache --file "$BASE_DEFINITION" --tag "$BASE_REF"
        shell: bash
        env:
          BASE_DEFINITION: ${{ inputs.base-image-definition }}
      # Does not pull when the previous step built the base image, because only the local daemon has that image.
      - name: Build container image
        run: |
          args=(--no-cache --file "$IMAGE_DEFINITION" --tag "$IMAGE_REF")
          if [ -n "$BASE_DEFINITION" ]; then
            args+=(--build-arg "${BASE_ARGUMENT}=${BASE_REF}")
          else
            args+=(--pull)
          fi
          docker build . "${args[@]}"
        shell: bash
        env:
          BASE_ARGUMENT: ${{ inputs.base-image-argument }}
          BASE_DEFINITION: ${{ inputs.base-image-definition }}
          IMAGE_DEFINITION: ${{ inputs.image-definition }}
      # Fails the job for each vulnerability that has one of the given severities and a fix.
      # The ignore file can exclude a vulnerability until a given date.
      - name: Scan container image with Trivy
        uses: ./workflow-parts/actions/trivy/scan
        with:
          scan-type: image
          target: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          # Skips the default file when it does not exist, but requires any other file that the caller gives.
          ignore-file: ${{ (inputs.trivy-ignore-file != '.trivyignore.yaml' || hashFiles('.trivyignore.yaml') != '') && inputs.trivy-ignore-file || '' }}
          pkg-types: os,library
          severity: ${{ inputs.severity }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IMAGE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
      BASE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}-base:${{ inputs.image-tag }}
