name: Pack & Push
description: Package .NET projects and push to the registry

inputs:
  dotnet-version:
    description: .NET SDK version to be used
    required: false
    default: "10.0"
  registry-token:
    description: Registry API key
    required: true
  registry-address:
    description: Registry address (NuGet.org by default)
    required: false
    default: "https://api.nuget.org/v3/index.json"
  push-enabled:
    description: Push the packages to the registry
    required: false
    default: "false"
  working-directory:
    description: Directory of the .NET code, relative to the workspace, which a composite action does not take from the defaults of the calling job
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Package
      run: dotnet pack --configuration Release -o output
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        DOTNET_NOLOGO: 1
        BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
        BUILD_BUILDID: ${{ github.run_id }}
    - name: Push to registry
      if: ${{ inputs.push-enabled == 'true' }}
      run: |
        for f in output/*.nupkg; do
          dotnet nuget push "$f" --api-key "$REGISTRY_TOKEN" --source "$REGISTRY_ADDRESS"
        done
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REGISTRY_ADDRESS: ${{ inputs.registry-address }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
