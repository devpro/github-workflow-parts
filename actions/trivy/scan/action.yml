name: Scan with Trivy
description: |
  Installs Trivy by downloading the official binary from its GitHub release and verifying its SHA256 checksum.
  Scans a container image or a directory for vulnerabilities or misconfigurations.
  Replaces aquasecurity/trivy-action, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  trivy-version:
    description: Version of Trivy to install (check latest from https://github.com/aquasecurity/trivy/releases)
    required: false
    default: "0.76.2"
  scan-type:
    description: >-
      Type of scan: "image" (container image reference),
      "rootfs" (vulnerabilities of the binaries and packages of a directory)
      or "config" (misconfiguration/IaC scan of a directory)
    required: false
    default: "image"
  target:
    description: Container image reference (scan-type "image") or directory path (scan-type "rootfs" or "config") to scan
    required: true
  format:
    description: Trivy report format (for example table, json, sarif, cyclonedx or spdx-json)
    required: false
    default: "table"
  output-file:
    description: Path of the generated report file (empty prints to stdout)
    required: false
    default: ""
  severity:
    description: Comma-separated list of severities to report
    required: false
    default: "CRITICAL,HIGH"
  exit-code:
    description: Exit code when there are findings of the given severities (0 = never fail the step)
    required: false
    default: "0"
  ignore-unfixed:
    description: Only report vulnerabilities with a fix available (scan-type "image" or "rootfs" only)
    required: false
    default: "false"
  pkg-types:
    description: Comma-separated package types to scan, os and/or library (scan-type "image" or "rootfs" only)
    required: false
    default: "os,library"
  skip-dirs:
    description: Comma-separated directories or glob patterns to exclude, relative to the target
    required: false
    default: ""
  ignore-file:
    description: >-
      Trivy ignore file (.trivyignore.yaml).
      Lists the findings to ignore, each with a reason and an expiry date (expired_at).
      Ignores no findings when empty.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_TARBALL: trivy_${{ inputs.trivy-version }}_Linux-${{ runner.arch == 'ARM64' && 'ARM64' || '64bit' }}.tar.gz
        TRIVY_CHECKSUMS: trivy_${{ inputs.trivy-version }}_checksums.txt
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

        echo "Downloading Trivy binary and checksums..."
        curl -fsSL -O "${BASE_URL}/${TRIVY_TARBALL}"
        curl -fsSL -O "${BASE_URL}/${TRIVY_CHECKSUMS}"

        echo "Verifying checksum..."
        if grep " ${TRIVY_TARBALL}$" "${TRIVY_CHECKSUMS}" | sha256sum --check --status; then
          echo "Verification successful!"
          tar -xzf "${TRIVY_TARBALL}" trivy
          chmod +x trivy
          # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
          mkdir -p "${RUNNER_TEMP}/bin"
          mv trivy "${RUNNER_TEMP}/bin/trivy"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          rm -f "${TRIVY_TARBALL}" "${TRIVY_CHECKSUMS}"
          trivy version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi
    - name: Run Trivy scan
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan-type }}
        TARGET: ${{ inputs.target }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        SEVERITY: ${{ inputs.severity }}
        EXIT_CODE: ${{ inputs.exit-code }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        PKG_TYPES: ${{ inputs.pkg-types }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        SKIP_DIRS: ${{ inputs.skip-dirs }}
      run: |
        args=("$SCAN_TYPE" --format "$FORMAT" --severity "$SEVERITY" --exit-code "$EXIT_CODE")

        # Stops when the ignore file does not exist, because Trivy continues without it and hides an incorrect path.
        if [ -n "$IGNORE_FILE" ]; then
          if [ ! -f "$IGNORE_FILE" ]; then
            echo "ERROR: Ignore file ${IGNORE_FILE} not found" >&2
            exit 1
          fi
          args+=(--ignorefile "$IGNORE_FILE")
        fi

        if [ -n "$SKIP_DIRS" ]; then
          args+=(--skip-dirs "$SKIP_DIRS")
        fi

        if [ -n "$OUTPUT_FILE" ]; then
          args+=(--output "$OUTPUT_FILE")
        fi

        # Scans a directory only for vulnerabilities, because the secret scanner also searches the bytes of each binary.
        if [ "$SCAN_TYPE" = "rootfs" ]; then
          args+=(--scanners vuln)
        fi

        # Adds no-progress, ignore-unfixed and pkg-types only to vulnerability scans, because other scans do not have them.
        if [ "$SCAN_TYPE" = "image" ] || [ "$SCAN_TYPE" = "rootfs" ]; then
          # Disables the progress bar, because each update of the bar adds text to the CI log.
          args+=(--no-progress)
          if [ "$IGNORE_UNFIXED" = "true" ]; then
            args+=(--ignore-unfixed)
          fi
          if [ -n "$PKG_TYPES" ]; then
            args+=(--pkg-types "$PKG_TYPES")
          fi
        fi

        args+=("$TARGET")

        echo "Running: trivy ${args[*]}"
        trivy "${args[@]}"
