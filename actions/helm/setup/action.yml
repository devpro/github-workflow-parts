name: Setup Helm
description: |
  Installs the Helm CLI by downloading the official binary from get.helm.sh and verifying its SHA256 checksum.
  Replaces azure/setup-helm, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  helm-version:
    description: Version of Helm to install (check latest from https://github.com/helm/helm/releases)
    required: false
    default: "v4.3.2"

runs:
  using: "composite"
  steps:
    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm-version }}
        HELM_PLATFORM: linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        HELM_TAR="helm-${HELM_VERSION}-${HELM_PLATFORM}.tar.gz"
        BASE_URL="https://get.helm.sh"

        echo "Downloading Helm binary and checksum..."
        curl -fsSL -O "${BASE_URL}/${HELM_TAR}"
        curl -fsSL -O "${BASE_URL}/${HELM_TAR}.sha256sum"

        echo "Verifying checksum..."
        if sha256sum --check --status "${HELM_TAR}.sha256sum"; then
          echo "Verification successful!"
          tar -xzf "${HELM_TAR}" "${HELM_PLATFORM}/helm"
          # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "${HELM_PLATFORM}/helm" "${RUNNER_TEMP}/bin/helm"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          rm -rf "${HELM_PLATFORM}" "${HELM_TAR}" "${HELM_TAR}.sha256sum"
          helm version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi
