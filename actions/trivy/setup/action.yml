name: Setup Trivy
description: |
  Installs Trivy by downloading the official binary from its GitHub release and verifying its SHA256 checksum,
  for a job running Trivy itself, where the Trivy scan action installs and runs it in one step.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  trivy-version:
    description: Version of Trivy to install (check latest from https://github.com/aquasecurity/trivy/releases)
    required: false
    default: "0.76.0"

runs:
  using: "composite"
  steps:
    # The same install as the Trivy scan action, which a composite action of this repository cannot call from a caller's workspace.
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_TARBALL: trivy_${{ inputs.trivy-version }}_Linux-${{ runner.arch == 'ARM64' && 'ARM64' || '64bit' }}.tar.gz
        TRIVY_CHECKSUMS: trivy_${{ inputs.trivy-version }}_checksums.txt
      run: |
        # Downloaded into a directory of its own, since the repository may hold a file or a directory named like the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

        echo "Downloading Trivy binary and checksums..."
        curl -fsSL -O "${BASE_URL}/${TRIVY_TARBALL}"
        curl -fsSL -O "${BASE_URL}/${TRIVY_CHECKSUMS}"

        echo "Verifying checksum..."
        if grep " ${TRIVY_TARBALL}$" "${TRIVY_CHECKSUMS}" | sha256sum --check --status; then
          echo "Verification successful!"
          tar -xzf "${TRIVY_TARBALL}" trivy
          chmod +x trivy
          # Installed where the job owns the directory, so neither root nor sudo is needed, on a hosted runner or in a container.
          mkdir -p "${RUNNER_TEMP}/bin"
          mv trivy "${RUNNER_TEMP}/bin/trivy"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          rm -f "${TRIVY_TARBALL}" "${TRIVY_CHECKSUMS}"
          trivy version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi
