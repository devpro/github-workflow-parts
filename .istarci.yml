# IstarCI configuration, read from the root of the repository.

runner:
  # The .NET jobs need the SDK, which a hosted runner has and the default image does not.
  images:
    "test-dotnet-*": ghcr.io/devpro/ubuntu-dotnet:latest
  # The container scan workflow builds an image through the host Docker daemon, as a hosted runner does, and Cosign reads a digest with the Docker CLI.
  docker: ["test-container-scan-on-base*", "test-cosign-sign*", "test-container-build-push*"]
  # The Sonar path of the .NET quality workflow runs against a SonarQube of this machine, which GitHub does not have.
  sonarqube: true

workflow:
  # Registering an emulator changes the kernel of the machine, which a local run leaves alone.
  skipJobs: [test-qemu-setup]
