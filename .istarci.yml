runner:
  images:
    "test-dotnet-*": ghcr.io/devpro/ubuntu-dotnet:latest
    test-npm-publish: ghcr.io/devpro/ubuntu-node:latest
    test-playwright-install: ghcr.io/devpro/ubuntu-node-playwright:latest
    test-node-quality-npm: ghcr.io/devpro/ubuntu-node-playwright:latest
    test-node-quality-pnpm: ghcr.io/devpro/ubuntu-node:latest
    test-node-quality-sonar: ghcr.io/devpro/ubuntu-node-playwright:latest
    test-npm-publication: ghcr.io/devpro/ubuntu-node:latest
    test-go-lint-govulncheck-scan: registry.suse.com/bci/golang:1.27
    test-bundler-setup: ghcr.io/devpro/ubuntu-ruby:latest
    "test-puppet-*": ghcr.io/devpro/ubuntu-ruby:latest
  docker: ["test-container-scan-on-base*", "test-cosign-sign*", "test-container-build-push*"]
  sonarqube:
    gate: true
    profile: Sonar way comprehensive
    projects:
      - github-workflow-parts-dotnet-fixture
      - github-workflow-parts-node-fixture
      - github-workflow-parts-sonar-properties

workflow:
  skipJobs: [test-qemu-setup]

vars:
  SONAR_ORGANIZATION: ""
