name: Generate SBOM with Syft
description: |
  Installs Syft by downloading the official binary from its GitHub release and verifying its SHA256 checksum.
  Generates a Software Bill of Materials for a container image or a source directory.
  Replaces anchore/sbom-action, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners (for example ubuntu-latest or ubuntu-24.04-arm), or Windows x64 runners (for example windows-2025).

inputs:
  syft-version:
    description: Version of Syft to install (check latest from https://github.com/anchore/syft/releases)
    required: false
    default: "1.57.2"
  target-image:
    description: Container image reference to scan (mutually exclusive with target-path)
    required: false
    default: ""
  target-path:
    description: Source directory to scan when target-image is not set
    required: false
    default: "."
  exclude-paths:
    description: Paths to exclude from the SBOM of a source directory, relative to target-path, one per line
    required: false
    default: ""
  output-format:
    description: SBOM format (see https://github.com/anchore/syft#supported-output-formats)
    required: false
    default: "spdx-json"
  output-file:
    description: Path of the generated SBOM file
    required: false
    default: "sbom.spdx.json"
  upload-artifact:
    description: Upload the generated SBOM as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded workflow artifact
    required: false
    default: "sbom"

runs:
  using: "composite"
  steps:
    - name: Install Syft
      shell: bash
      env:
        SYFT_VERSION: ${{ inputs.syft-version }}
        SYFT_ARCHIVE: >-
          syft_${{ inputs.syft-version }}_${{ runner.os == 'Windows' && 'windows_amd64.zip'
          || format('linux_{0}.tar.gz', runner.arch == 'ARM64' && 'arm64' || 'amd64') }}
        SYFT_CHECKSUMS: syft_${{ inputs.syft-version }}_checksums.txt
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"

        echo "Downloading Syft binary and checksums..."
        curl -fsSL -O "${BASE_URL}/${SYFT_ARCHIVE}"
        curl -fsSL -O "${BASE_URL}/${SYFT_CHECKSUMS}"

        echo "Verifying checksum..."
        if grep " ${SYFT_ARCHIVE}$" "${SYFT_CHECKSUMS}" | sha256sum --check --status; then
          echo "Verification successful!"
          # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
          mkdir -p "${RUNNER_TEMP}/bin"
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -q "${SYFT_ARCHIVE}" syft.exe
            mv syft.exe "${RUNNER_TEMP}/bin/syft.exe"
            # Converts the Windows path, because bash uses the colon of the drive as a separator in PATH.
            PATH="$(cygpath -u "${RUNNER_TEMP}/bin"):$PATH"
            export PATH
          else
            tar -xzf "${SYFT_ARCHIVE}" syft
            chmod +x syft
            mv syft "${RUNNER_TEMP}/bin/syft"
            export PATH="${RUNNER_TEMP}/bin:$PATH"
          fi
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          rm -f "${SYFT_ARCHIVE}" "${SYFT_CHECKSUMS}"
          syft version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi
    - name: Generate SBOM
      shell: bash
      env:
        TARGET_IMAGE: ${{ inputs.target-image }}
        TARGET_PATH: ${{ inputs.target-path }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        if [ -n "$TARGET_IMAGE" ]; then
          SOURCE="$TARGET_IMAGE"
        else
          SOURCE="dir:${TARGET_PATH}"
        fi

        # Adds ./ to each exclusion, because Syft compares the exclusions with paths that start with ./
        args=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then
            args+=(--exclude "./${path#./}")
          fi
        done <<< "$EXCLUDE_PATHS"

        echo "Scanning ${SOURCE} with Syft..."
        syft "$SOURCE" "${args[@]}" -o "${OUTPUT_FORMAT}=${OUTPUT_FILE}"
    - name: Upload SBOM as artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-file }}
