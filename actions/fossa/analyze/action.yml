name: Analyze with FOSSA
description: |
  Installs the FOSSA CLI by downloading the official binary from its GitHub release and verifying its SHA256 checksum.
  Analyzes the licenses of the dependencies, can test them against the policy, and writes an HTML report.
  Replaces fossas/fossa-action, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  fossa-version:
    description: Version of the FOSSA CLI to install (check latest from https://github.com/fossas/fossa-cli/releases)
    required: false
    default: "3.21.1"
  api-key:
    description: FOSSA API key
    required: true
  exclude-paths:
    description: Paths to exclude from the analysis, relative to working-directory, one per line
    required: false
    default: ""
  run-tests:
    description: Test the analyzed dependencies against the FOSSA policy
    required: false
    default: "false"
  test-diff-revision:
    description: >-
      Revision to compare with, to report only newer issues.
      Reports all issues when empty.
    required: false
    default: ""
  report-file:
    description: >-
      Path of the generated HTML report, relative to the working directory.
      Writes no report when empty.
    required: false
    default: "report/fossa.html"
  working-directory:
    description: >-
      Directory of the project to analyze, relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install FOSSA CLI
      shell: bash
      env:
        FOSSA_VERSION: ${{ inputs.fossa-version }}
        FOSSA_TARBALL: fossa_${{ inputs.fossa-version }}_linux_${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}.tar.gz
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        BASE_URL="https://github.com/fossas/fossa-cli/releases/download/v${FOSSA_VERSION}"

        echo "Downloading FOSSA CLI binary and checksum..."
        curl -fsSL -O "${BASE_URL}/${FOSSA_TARBALL}"
        curl -fsSL -O "${BASE_URL}/${FOSSA_TARBALL}.sha256"

        echo "Verifying checksum..."
        # Reads only the first word, because the checksum file can have the file name after the hash.
        if echo "$(cut -d ' ' -f 1 "${FOSSA_TARBALL}.sha256")  ${FOSSA_TARBALL}" | sha256sum --check --status; then
          echo "Verification successful!"
          tar -xzf "${FOSSA_TARBALL}" fossa
          chmod +x fossa
          # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
          mkdir -p "${RUNNER_TEMP}/bin"
          mv fossa "${RUNNER_TEMP}/bin/fossa"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          rm -f "${FOSSA_TARBALL}" "${FOSSA_TARBALL}.sha256"
          fossa --version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi

    - name: Analyze dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FOSSA_API_KEY: ${{ inputs.api-key }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: |
        args=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then
            args+=(--exclude-path "$path")
          fi
        done <<< "$EXCLUDE_PATHS"
        fossa analyze "${args[@]}"

    - name: Test dependencies against the policy
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FOSSA_API_KEY: ${{ inputs.api-key }}
        DIFF_REVISION: ${{ inputs.test-diff-revision }}
      run: |
        if [ -n "$DIFF_REVISION" ]; then
          fossa test --diff "$DIFF_REVISION"
        else
          fossa test
        fi

    - name: Write HTML report
      if: ${{ inputs.report-file != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FOSSA_API_KEY: ${{ inputs.api-key }}
        REPORT_FILE: ${{ inputs.report-file }}
      run: |
        mkdir -p "$(dirname "$REPORT_FILE")"
        fossa report attribution --format html > "$REPORT_FILE"
