name: Setup kind
description: |
  Installs kind, which runs a Kubernetes cluster in containers, and kubectl,
  by downloading the official binaries and verifying their SHA256 checksums
  (replacement for helm/kind-action, a JavaScript action, which a container job cannot run without Node.js).
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  kind-version:
    description: Version of kind to install (check latest from https://github.com/kubernetes-sigs/kind/releases)
    required: false
    default: "v0.33.0"
  kubectl-version:
    description: Version of kubectl to install, within one minor version of the clusters it talks to (check latest from https://dl.k8s.io/release/stable.txt)
    required: false
    default: "v1.37.1"

runs:
  using: "composite"
  steps:
    - name: Install kind and kubectl
      shell: bash
      env:
        ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        KIND_VERSION: ${{ inputs.kind-version }}
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
      run: |
        # Downloaded into a directory of its own, since the repository may hold a file or a directory named like the binary.
        cd "$(mktemp -d)"
        KIND_BINARY="kind-linux-${ARCH}"
        curl -fsSL -O "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/${KIND_BINARY}"
        curl -fsSL -O "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/${KIND_BINARY}.sha256sum"
        sha256sum --check --status "${KIND_BINARY}.sha256sum"
        KUBECTL_URL="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
        curl -fsSL -O "$KUBECTL_URL"
        # The checksum file of kubectl holds the hash alone.
        echo "$(curl -fsSL "${KUBECTL_URL}.sha256")  kubectl" | sha256sum --check --status
        # Installed where the job owns the directory, so neither root nor sudo is needed, on a hosted runner or in a container.
        mkdir -p "${RUNNER_TEMP}/bin"
        install -m 0755 "${KIND_BINARY}" "${RUNNER_TEMP}/bin/kind"
        install -m 0755 kubectl "${RUNNER_TEMP}/bin/kubectl"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/kind" version
        "${RUNNER_TEMP}/bin/kubectl" version --client
