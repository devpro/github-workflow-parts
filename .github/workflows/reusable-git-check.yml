name: Reusable - Git check

on:
  workflow_call:
    inputs:
      job-name:
        description: Job name
        type: string
        required: false
        default: Check
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 10
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      paths:
        description: >-
          Paths to check for changes, separated by spaces.
          The changed output gives the result.
        type: string
        required: false
        default: "src test"
      version-file:
        description: >-
          MSBuild file (for example Directory.Build.props) with the VersionPrefix for the version-major-minor output.
          Reads no version when empty.
        type: string
        required: false
        default: ""
      workflow-parts-version:
        description: >-
          GitHub workflow parts version (branch/tag/SHA).
          Use the same version as the one that calls this reusable workflow.
          Ignored when this repository is the caller, because it tests the actions of the current commit.
        type: string
        required: false
        default: "main"
    outputs:
      branch-slug:
        description: >-
          Branch name to use in an environment name: without the first segment (feature/, release/), in lower case, with only letters, digits and dashes
        value: ${{ jobs.git-check.outputs.branch-slug }}
      changed:
        description: Set to "true" when the commit changes one of the paths, or when there is no base to compare with
        value: ${{ jobs.git-check.outputs.changed }}
      version-major-minor:
        description: Major and minor parts of the VersionPrefix in the version file, for example to tag an image
        value: ${{ jobs.git-check.outputs.version-major-minor }}

jobs:
  git-check:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      branch-slug: ${{ steps.slug.outputs.branch-slug }}
      changed: ${{ steps.changes.outputs.changed }}
      version-major-minor: ${{ steps.version.outputs.version-major-minor }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetches the history, because the comparison needs the base commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Check changes
        id: changes
        uses: ./workflow-parts/actions/git/check-changes
        with:
          paths: ${{ inputs.paths }}
      - name: Read the version
        id: version
        if: inputs.version-file != ''
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          version=$(grep -oP '(?<=<VersionPrefix>)[^<]+' "$VERSION_FILE" | head -n 1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "ERROR: no VersionPrefix in ${VERSION_FILE}" >&2
            exit 1
          fi
          echo "Version ${version}"
          echo "version-major-minor=$(cut -d . -f 1-2 <<< "$version")" >> "$GITHUB_OUTPUT"
      # Reads the branch of a pull request from GITHUB_HEAD_REF, because GITHUB_REF_NAME contains the merge ref.
      - name: Name the branch
        id: slug
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          slug=$(tr '/' '-' <<< "${branch#*/}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')
          echo "Branch ${branch}, slug ${slug}"
          echo "branch-slug=${slug}" >> "$GITHUB_OUTPUT"
