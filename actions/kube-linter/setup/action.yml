name: Setup kube-linter
description: |
  Installs kube-linter by downloading the official binary from its GitHub release and verifying its SHA256 checksum.
  The checksum is pinned here, because the release contains no checksum file.
  Replaces stackrox/kube-linter-action, to reduce third-party GitHub Action supply-chain risk.
  Linux x64 or arm64 runners only (for example ubuntu-latest or ubuntu-24.04-arm).

inputs:
  kube-linter-version:
    description: Version of kube-linter to install (check latest from https://github.com/stackrox/kube-linter/releases)
    required: false
    default: "v0.8.3"
  kube-linter-sha256:
    description: >-
      SHA256 of the kube-linter archive for x64.
      Required when kube-linter-version changes, because the release contains no checksum file.
    required: false
    default: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"  # v0.8.3
  kube-linter-sha256-arm64:
    description: SHA256 of the kube-linter archive for arm64, required when kube-linter-version changes
    required: false
    default: "802e1b09eabd08f6f0a060a6b8ab2bf7bc7e6bf4f673bb2692303704c84b3e22"  # v0.8.3

runs:
  using: "composite"
  steps:
    - name: Install kube-linter
      shell: bash
      env:
        KUBE_LINTER_VERSION: ${{ inputs.kube-linter-version }}
        KUBE_LINTER_TARBALL: kube-linter-linux${{ runner.arch == 'ARM64' && '_arm64' || '' }}.tar.gz
        KUBE_LINTER_SHA256: ${{ runner.arch == 'ARM64' && inputs.kube-linter-sha256-arm64 || inputs.kube-linter-sha256 }}
      run: |
        # Downloads to a new directory, because the repository can contain a file or a directory with the name of the binary.
        cd "$(mktemp -d)"
        curl -fsSL -O "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/${KUBE_LINTER_TARBALL}"
        echo "${KUBE_LINTER_SHA256}  ${KUBE_LINTER_TARBALL}" | sha256sum --check --status
        tar -xzf "${KUBE_LINTER_TARBALL}" kube-linter
        # Installs in a directory that the job owns, so that a hosted runner or a container needs no root access and no sudo.
        mkdir -p "${RUNNER_TEMP}/bin"
        mv kube-linter "${RUNNER_TEMP}/bin/kube-linter"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/bin/kube-linter" version
