name: Build & Test
description: Builds and tests .NET code

inputs:
  dotnet-test-args:
    description: .NET test arguments
    required: false
    default: ""
  report-folder:
    description: Folder where report files will be generated
    required: false
    default: report
  working-directory:
    description: >-
      Directory of the .NET code, relative to the workspace.
      A composite action does not use the default working directory of the job.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Build .NET code
      run: dotnet build --no-restore --configuration Debug
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
        BUILD_BUILDID: ${{ github.run_id }}
    - name: Run tests
      # Reads the arguments from a variable, so that GitHub does not paste them into the script.
      # Uses eval so that the shell applies the quotes in the arguments.
      run: |
        test_args=()
        eval "test_args=(${DOTNET_TEST_ARGS})"
        dotnet test --no-build --verbosity normal --configuration Debug \
          --results-directory "$REPORT_FOLDER/TestResults" \
          "${test_args[@]}"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ASPNETCORE_ENVIRONMENT: Development
        DOTNET_TEST_ARGS: ${{ inputs.dotnet-test-args }}
        REPORT_FOLDER: ${{ inputs.report-folder }}
    # Searches all subfolders, because VSTest writes the coverage to a new folder for each run.
    # Microsoft.Testing.Platform writes it next to the test results.
    - name: Generate test report
      if: ${{ always() && hashFiles(format('{0}/{1}/TestResults/**/*.cobertura.xml', inputs.working-directory, inputs.report-folder)) != '' }}
      run: |
        reportgenerator "-reports:$REPORT_FOLDER/TestResults/**/*.cobertura.xml" \
          "-targetdir:$REPORT_FOLDER" \
          "-reporttypes:Cobertura;Html;TextSummary"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_FOLDER: ${{ inputs.report-folder }}
