name: Reusable - npm publication

# Requires "packages: write" from the caller to publish to GitHub Packages.
# Requires "id-token: write" from the caller for npm trusted publishing to npmjs.org.
on:
  workflow_call:
    inputs:
      build-command:
        description: >-
          Commands to build and check the package before the publication, run from the root of the repository.
          Runs the build script of package.json by default, and nothing when empty.
        type: string
        required: false
        # Builds only when the root has a package.json, because npm has nothing to build without it.
        default: "if [ -f package.json ]; then npm run --if-present build; fi"
      job-name:
        description: Job name
        type: string
        required: false
        default: Publication
      node-version:
        description: Version of Node.js to install
        type: string
        required: false
        default: "24"
      operating-system:
        description: Operating system executing the runner
        type: string
        required: false
        default: ubuntu-latest
      pnpm-version:
        description: >-
          Version of pnpm to install the dependencies from pnpm-lock.yaml.
          When empty, npm installs the dependencies from package-lock.json.
        type: string
        required: false
        default: ""
      publish-command:
        description: Command to publish the package (for example "pnpm publish --no-git-checks" for a pnpm workspace)
        type: string
        required: false
        default: "npm publish"
      registry-url:
        description: >-
          Registry to publish to.
          GitHub Packages (https://npm.pkg.github.com) uses the token of the run.
          npmjs.org uses the OIDC token of trusted publishing.
        type: string
        required: false
        default: "https://registry.npmjs.org"
      scope:
        description: Scope of the package (for example "@devpro"), required by GitHub Packages
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: Minutes the job may run before it is cancelled
        type: number
        required: false
        default: 20
      workflow-parts-version:
        description: >-
          GitHub workflow parts version (branch/tag/SHA).
          Use the same version as the one that calls this reusable workflow.
          Ignored when this repository is the caller, because it tests the actions of the current commit.
        type: string
        required: false
        default: "main"
      working-directory:
        description: Directory that contains the package.json of the package, relative to the root of the repository
        type: string
        required: false
        default: "."
    outputs:
      published:
        description: Set to "true" when the action published the package, or "false" when the version was already published
        value: ${{ jobs.npm-publication.outputs.published }}
      version:
        description: Version of the package, read from its package.json
        value: ${{ jobs.npm-publication.outputs.version }}

jobs:
  npm-publication:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.operating-system }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout workflow parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devpro/github-workflow-parts
          # Uses the current commit when this repository is the caller, so that the CI tests the actions of that commit.
          ref: ${{ github.repository == 'devpro/github-workflow-parts' && github.sha || inputs.workflow-parts-version }}
          path: workflow-parts
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # Writes the .npmrc that npm publish and npm view use to authenticate.
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}
          # Disables the cache, because it could contain files from another branch.
          package-manager-cache: false
      # Installs pnpm with npm, so that no third-party action is necessary.
      - name: Setup pnpm
        if: inputs.pnpm-version != ''
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          # Skips the install when the image already has this version, as in some container jobs.
          current=$(pnpm --version 2>/dev/null || true)
          if [[ "$current" != "$PNPM_VERSION" && "$current" != "$PNPM_VERSION".* ]]; then
            npm install --global "pnpm@${PNPM_VERSION}"
          fi
      - name: Install dependencies
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          if [[ -n "$PNPM_VERSION" ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No package-lock.json, nothing to install"
          fi
      - name: Build the package
        if: inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        # Runs the shell code from a variable, so that GitHub does not paste it into the script.
        run: eval "$BUILD_COMMAND"
      # Uses the token of the run for GitHub Packages.
      # For npmjs.org, npm gets the short-lived OIDC token of trusted publishing.
      - name: Publish the package
        id: publish
        uses: ./workflow-parts/actions/npm/publish
        with:
          publish-command: ${{ inputs.publish-command }}
          working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ contains(inputs.registry-url, 'npm.pkg.github.com') && github.token || '' }}
