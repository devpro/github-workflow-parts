name: Sign a container image
description: |
  Make sure to add (needed by cosign):
  ```
  permissions:
    id-token: write
    contents: read
  ```

inputs:
  cosign-version:
    description: Version of cosign (check latest from https://github.com/sigstore/cosign/releases)
    required: false
    default: 'v3.0.6'
  image-name:
    description: Image name
    required: true
  image-path:
    description: Image path
    required: true
  image-tag:
    description: Image tag
    required: true
  readonly:
    description: If true, skip the signing step
    required: false
    default: 'false'

outputs:
  digest:
    description: Digest of the image, which the signature is attached to
    value: ${{ steps.digest.outputs.DIGEST }}

runs:
  using: "composite"
  steps:
    - name: Install Cosign
      run: |
        # Downloaded into a directory of its own, since the repository may hold a file or a directory named like the binary.
        cd "$(mktemp -d)"
        echo "Downloading Cosign binary and checksums..."
        curl -fsSL -O "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${COSIGN_BINARY}"
        curl -fsSL -O "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${COSIGN_CHECKSUM_FILE}"

        echo "Verifying checksum..."
        if grep " ${COSIGN_BINARY}$" "${COSIGN_CHECKSUM_FILE}" | sha256sum --check --status; then
          echo "Verification successful!"
          rm "$COSIGN_CHECKSUM_FILE"
          chmod +x "$COSIGN_BINARY"
          # Installed where the job owns the directory, so neither root nor sudo is needed, on a hosted runner or in a container.
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "$COSIGN_BINARY" "${RUNNER_TEMP}/bin/cosign"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          cosign version
        else
          echo "ERROR: Checksum verification failed!" >&2
          exit 1
        fi
      shell: bash
      env:
        COSIGN_BINARY: cosign-linux-amd64
        COSIGN_CHECKSUM_FILE: cosign_checksums.txt
        COSIGN_VERSION: ${{ inputs.cosign-version }}
    - name: Get image digest
      id: digest
      run: |
        DIGEST=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' | jq -r '.digest')
        # A digest missing from the registry answer would otherwise be signed as the literal text "null".
        if [[ "$DIGEST" != sha256:* ]]; then
          echo "ERROR: No digest found for ${IMAGE_REF}" >&2
          exit 1
        fi
        echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-path }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
    - name: Sign image with Cosign
      if: inputs.readonly != 'true'
      env:
        COSIGN_EXPERIMENTAL: 1
        IMAGE_REPOSITORY: ${{ inputs.image-path }}/${{ inputs.image-name }}
        DIGEST: ${{ steps.digest.outputs.DIGEST }}
      run: cosign sign --yes "${IMAGE_REPOSITORY}@${DIGEST}"
      shell: bash
